<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PlayPocket — Screen-Free Cognitive Play</title>
<style>
:root{
  --ink:#2f3a36;
  --muted:#7d8a84;
  --bg:#fbf6f8;
  --surface:#ffffff;
  --line:#eadfe5;
  --soft:#f8f2f5;
  --accent:#8daf9d;
  --accent-strong:#6e9480;
  --accent-soft:#eef5f0;
  --rose:#e8bfd0;
  --rose-soft:#f9eaf1;
  --shadow:0 10px 28px rgba(97,111,104,.06);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
  color:var(--ink)
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{color:inherit}
.app{width:100%;max-width:560px;min-height:100vh;margin:0 auto;background:var(--bg);padding-bottom:96px}
.page{padding:0 20px 40px}
.brand{height:76px;padding:16px 20px;display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.brandname{font-size:19px;font-weight:750;letter-spacing:-.03em}
.profilepill{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;cursor:pointer}
.profilepill span,.avatar{width:30px;height:30px;border-radius:10px;background:var(--rose-soft);color:var(--accent-strong);display:grid;place-items:center;font-weight:750}
.eyebrow{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
h1,h2,strong{letter-spacing:-.03em}
.hero,.quicknow,.panel,.card,.gamehero,.skillpanel,.info,.variation,.reassure,.evidence,.profileinsight,.profilesummary,.search,.empty{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
.hero{margin:0 20px 24px;padding:28px 24px;display:grid;gap:18px;background:linear-gradient(180deg,#fff,#fbf8fa)}
.hero h1{font-size:42px;line-height:1.02;margin:0;font-weight:760}
.hero h1 em{font-style:normal;color:var(--accent-strong)}
.hero p,.muted{color:var(--muted);line-height:1.56}
.hero p{font-size:15px;margin:0;max-width:42ch}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary,.secondary{border-radius:18px;min-height:56px;padding:0 18px;font-weight:720;cursor:pointer;display:flex;align-items:center;justify-content:center}
.primary{border:0;background:var(--accent-strong);color:#fff}
.secondary{border:1px solid var(--line);background:var(--rose-soft);color:var(--ink)}
.trust{padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}
.quicknow{margin:0 20px 24px;padding:18px;display:grid;grid-template-columns:46px 1fr 42px;gap:12px;align-items:center;background:linear-gradient(180deg,#fff,#f8fbf8)}
.quickicon{width:46px;height:46px;border-radius:15px;background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:#fff;display:grid;place-items:center;font-size:15px}
.quicknow h2{font-size:21px;line-height:1.1;margin:3px 0 4px;font-weight:730}
.quicknow p{font-size:12px;margin:0}
.roundbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--rose-soft);cursor:pointer}
.section{padding:0 20px 24px}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sectionhead h2{font-size:29px;line-height:1.06;margin:4px 0 0;font-weight:740}
.smalllink,.textbtn{border:0;background:transparent;color:#111;font-weight:700;cursor:pointer;font-size:12px}
.skillstrip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skillchip{border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fcf8fa);border-radius:24px;padding:18px 16px;min-height:118px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.skillchip b{font-size:16px;font-weight:740;line-height:1.05;display:flex;align-items:center;gap:8px}
.skillchip span{font-size:11px;color:var(--muted);line-height:1.4}
.panel{margin:0 20px 24px;padding:22px;background:linear-gradient(180deg,#fff,#fdfafb)}
.panel h2{font-size:25px;line-height:1.06;margin:5px 0 0;font-weight:740}
.panel p{font-size:12px;margin:12px 0 0}
.skillmix{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.skillmix div{min-height:84px;background:var(--accent-soft);border:1px solid #dce8df;border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.skillmix strong{font-size:14px;font-weight:720;display:flex;align-items:center;gap:8px}
.skillmix span{font-size:11px;color:var(--muted);line-height:1.4}
.weeklylist{display:grid;gap:10px;margin-top:14px}
.weeklylist button{border:1px solid var(--line);background:var(--soft);border-radius:18px;min-height:56px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:12px;font-weight:700;cursor:pointer}.weeklylist .label{display:flex;align-items:center;gap:8px}
.quickgrid{display:grid;grid-template-columns:1fr;gap:12px}
.mini{border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fcf8fa);border-radius:24px;padding:18px;text-align:left;min-height:158px;cursor:pointer;display:flex;flex-direction:column}
.mini .topline{display:flex;justify-content:space-between;margin-bottom:18px}.mini .topline .miniemoji{font-size:20px}
.mini strong{font-size:23px;line-height:1.05;margin-bottom:8px;font-weight:740}
.mini small{font-size:12px;color:var(--muted);line-height:1.45}
.miniskill{margin-top:auto;padding-top:14px;font-size:10px;font-weight:750;color:var(--accent-strong)}
.reassure{margin:0 20px 24px;padding:18px;display:flex;gap:12px;background:linear-gradient(180deg,#fff,#f8fbf8)}
.reassure p{font-size:12px;margin:4px 0 0}
.topbar{height:66px;padding:10px 14px;position:sticky;top:0;z-index:5;background:rgba(251,246,248,.92);backdrop-filter:blur(14px);display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center;font-size:13px;font-weight:720;border-bottom:1px solid var(--line)}
.iconbtn{border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:14px;font-size:20px;cursor:pointer}
.intro{padding:24px 0 20px}
.intro h1{font-size:36px;line-height:1.02;margin:8px 0 10px;font-weight:760}
.intro p{font-size:14px;margin:0}
.presets{display:flex;gap:8px;overflow:auto;padding-bottom:10px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:700;cursor:pointer}
.q{padding:24px 0;border-top:1px solid var(--line)}
.q h2{font-size:24px;margin:0 0 6px;font-weight:740}
.qsub{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.grid{display:grid;gap:10px}.grid.two{grid-template-columns:repeat(2,1fr)}.grid.four{grid-template-columns:repeat(4,1fr)}
.choice,.skillchoice,.material{border:1px solid var(--line);background:#fff;cursor:pointer}
.choice{min-height:82px;border-radius:20px;padding:12px;font-size:12px;font-weight:700}
.age{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.age .choice{aspect-ratio:1;min-height:0}
.sel{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
.sel small{color:#eef6f1!important}.sel .skillicon{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.24)}
.profilesummary{width:100%;padding:12px 14px;display:grid;grid-template-columns:42px 1fr 24px;gap:10px;align-items:center;text-align:left;cursor:pointer}
.profilesummary strong{display:block;font-size:13px}.profilesummary small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skillchoice{min-height:128px;border-radius:24px;padding:16px;display:flex;align-items:flex-start;gap:10px;text-align:left;background:linear-gradient(180deg,#fff,#fbf8fa)}
.skillchoice.wide{grid-column:1/-1;min-height:96px}
.skillicon{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);border:1px solid #dce8df;display:grid;place-items:center;font-size:13px;flex:none}
.skillchoice strong{font-size:14px;font-weight:720}.skillchoice small{display:block;font-size:10px;color:var(--muted);line-height:1.4;margin-top:4px}
.materialgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.material{border-radius:20px;min-height:92px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:8px;background:linear-gradient(180deg,#fff,#f8fbf8)}.material span{font-size:21px}
.full{width:100%;margin-top:12px}
.match{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.match div{border:1px solid var(--line);background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.match span{display:block;text-transform:uppercase;color:var(--muted);letter-spacing:.09em;font-size:9px;font-weight:700}.match strong{display:block;margin-top:6px;font-size:13px;font-weight:720}
.cards{display:grid;gap:14px}.card{padding:20px;overflow:hidden}.cardtop{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin-bottom:16px}.rank{width:40px;height:40px;border-radius:14px;background:var(--accent-soft);border:1px solid #dce8df;display:grid;place-items:center;font-size:10px;font-weight:750} .cardlabel{text-align:center;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.10em}.heart{border:0;background:transparent;font-size:21px;cursor:pointer}.emoji-inline{margin-right:6px}.metainline{display:flex;gap:6px;flex-wrap:wrap}.metainline span{font-size:10px;background:var(--accent-soft);border:1px solid #dce8df;border-radius:999px;padding:6px 9px;color:var(--accent-strong);font-weight:700}.card h2{font-size:31px;line-height:1.02;margin:12px 0 8px;font-weight:760}.card p{font-size:14px;margin:0}.skillblock{padding:14px 0 12px;margin-top:12px;border-top:1px solid var(--line)}.skilllabel{display:block;color:#929793;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:7px}.tags{display:flex;gap:7px;flex-wrap:wrap}.skilltag{background:var(--accent-soft);border:1px solid #d9e7dd;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:6px}.why{margin:12px 0 10px;background:var(--rose-soft);border:1px solid var(--line);border-radius:18px;padding:12px 14px;color:#5d625f;font-size:11px;line-height:1.5}.softtag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;color:var(--muted)}.cardaction{width:100%;margin-top:14px;border:0;background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:#fff;border-radius:18px;min-height:54px;padding:0 16px;font-weight:720;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.empty{padding:20px;font-size:14px;color:var(--muted)}
.gamehero{padding:24px;margin-top:2px}.gameicon{width:52px;height:52px;border-radius:17px;background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:#fff;display:grid;place-items:center;font-size:22px;margin-bottom:16px}.gamehero h1{font-size:38px;line-height:1.02;margin:8px 0 10px;font-weight:760}.metagrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.metabox{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:14px}.metabox span{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:9px;color:#929793;font-weight:700}.metabox strong{display:block;margin-top:6px;font-size:13px;font-weight:720}
.skillpanel,.info{padding:20px;margin-top:14px}.info h2,.feedback h2{font-size:24px;margin:0 0 10px;font-weight:740}.inlineaction{margin-top:12px;border:1px solid var(--line);background:var(--rose-soft);border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer}.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px}.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px}.num{width:32px;height:32px;border-radius:11px;background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:#fff;display:grid;place-items:center;font-size:11px;font-weight:750}.variations{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}.variation{padding:18px}.variation strong{display:block;font-size:16px;margin-bottom:6px}.variation p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.evidence{margin-top:14px;padding:16px;display:flex;gap:10px;font-size:12px;color:var(--muted);line-height:1.5}.feedback{padding:20px 0 0}.feedback p{font-size:13px;color:var(--muted)}.feedbackgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.feedbackgrid button{border:1px solid var(--line);background:#fff;border-radius:18px;min-height:54px;padding:12px;font-weight:700;cursor:pointer;text-align:left}.search{display:flex;align-items:center;gap:8px;padding:12px 16px;margin-bottom:14px}.search input,.textinput{width:100%;border:0;background:transparent;outline:none;font-size:14px}.textinput{border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px 16px}.profileswitch{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.profileswitch button{border:1px solid var(--line);background:var(--rose-soft);border-radius:999px;padding:10px 14px;font-weight:700} .profileinsight{padding:18px;display:flex;gap:12px;margin-top:16px}.profileinsight p{font-size:12px;margin:4px 0 0}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border-radius:999px;background:var(--accent-soft);border:1px solid #d9e7dd;font-size:11px;font-weight:700;color:var(--accent-strong)}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(520px,calc(100% - 22px));background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:7px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;box-shadow:0 18px 38px rgba(120,132,126,.12)}.nav button{border:0;background:transparent;border-radius:18px;min-height:56px;display:grid;place-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}.nav .active{background:var(--accent-strong);color:#fff}
@media(max-width:520px){.actions{grid-template-columns:1fr}.grid.four{grid-template-columns:repeat(2,1fr)}.skillgrid,.skillstrip,.match,.feedbackgrid,.metagrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const games = [
  {
    id: 'secret-delivery',
    title: 'Secret Delivery',
    summary: 'Remember a little mission and deliver the right objects in order.',
    ageMin: 5,
    ageMax: 7,
    duration: 10,
    locations: ['home'],
    materials: ['kitchen-objects', 'socks', 'toys'],
    skills: ['memory', 'attention'],
    energy: 'medium',
    challenge: 2,
    setupMinutes: 1,
    instructions: [
      'Place 3–5 familiar objects at one end of the room.',
      'Give a short mission: “Bring me the spoon, then the sock, then the red cup.”',
      'Let your child complete the mission without reminders if they can.',
      'Swap roles after a few rounds so your child gives you a mission.'
    ],
    supports: 'Practises holding several pieces of information in mind while staying focused on a goal.',
    easier: 'Ask for two objects only, with no order requirement.',
    harder: 'Add a fourth object or a rule such as touching the sofa before every delivery.',
    silly: 'Use a secret-agent voice and invent an urgent “mission from headquarters.”',
    safety: 'Use lightweight, non-breakable objects.',
    parentEffort: 'low',
  },
  {
    id: 'sock-sort-sprint',
    title: 'Sock Sort Sprint',
    summary: 'Turn a pile of socks into a fast little pattern-and-matching challenge.',
    ageMin: 4,
    ageMax: 7,
    duration: 5,
    locations: ['home'],
    materials: ['socks'],
    skills: ['attention', 'spatial', 'numbers'],
    energy: 'medium',
    challenge: 1,
    setupMinutes: 1,
    instructions: [
      'Scatter several pairs of socks on the floor.',
      'Ask your child to find matching pairs.',
      'Next, sort them by colour, size, pattern, or owner.',
      'Finish by counting how many pairs you found.'
    ],
    supports: 'Practises visual attention, matching, categorising, and early number sense.',
    easier: 'Use only three very different pairs.',
    harder: 'Mix in similar-looking socks or ask for two sorting rules at once.',
    silly: 'Pretend every sock is looking for its “best friend.”',
    parentEffort: 'low',
  },
  {
    id: 'cushion-islands',
    title: 'Cushion Islands',
    summary: 'Cross the room using cushions as islands while following changing movement rules.',
    ageMin: 4,
    ageMax: 8,
    duration: 10,
    locations: ['home'],
    materials: ['cushions'],
    skills: ['movement', 'body-awareness', 'self-control'],
    energy: 'active',
    challenge: 2,
    setupMinutes: 2,
    instructions: [
      'Place cushions on the floor with safe gaps between them.',
      'The floor becomes “water”; your child moves from island to island.',
      'Call out a rule before each crossing: tiptoe, freeze halfway, move sideways, or carry a toy.',
      'Let your child invent the next movement rule.'
    ],
    supports: 'Practises balance, motor planning, body awareness, and stopping or changing an action on cue.',
    easier: 'Put cushions close together and use normal walking.',
    harder: 'Increase gaps slightly or add memory rules such as “red cushion, then blue cushion.”',
    silly: 'Add imaginary sharks, sleeping dragons, or ticklish lava.',
    safety: 'Use a clear floor area, non-slip cushions, and no jumping near furniture.',
    parentEffort: 'medium',
  },
  {
    id: 'story-dice-without-dice',
    title: 'Three-Thing Story',
    summary: 'Build a tiny story around three random things you can see.',
    ageMin: 4,
    ageMax: 8,
    duration: 10,
    locations: ['home', 'outside', 'car', 'waiting'],
    materials: ['none'],
    skills: ['language', 'creativity'],
    energy: 'calm',
    challenge: 1,
    setupMinutes: 0,
    instructions: [
      'Choose three things you can both see, such as a dog, a red sign, and a cloud.',
      'Start a story that includes the first object.',
      'Take turns adding one sentence at a time.',
      'Make sure all three objects appear before the story ends.'
    ],
    supports: 'Practises vocabulary, sequencing, flexible thinking, and shared storytelling.',
    easier: 'Use two objects and let the parent do most of the story setup.',
    harder: 'Add a required emotion, character goal, or surprise ending.',
    silly: 'Every third sentence must contain a ridiculous sound effect.',
    parentEffort: 'low',
  },
  {
    id: 'copy-my-clap',
    title: 'Copy My Clap',
    summary: 'Repeat growing clap-and-tap patterns like a living memory game.',
    ageMin: 4,
    ageMax: 8,
    duration: 5,
    locations: ['home', 'outside', 'waiting'],
    materials: ['none'],
    skills: ['memory', 'attention', 'movement'],
    energy: 'medium',
    challenge: 1,
    setupMinutes: 0,
    instructions: [
      'Make a simple two-part pattern, such as clap-clap, tap knees.',
      'Your child copies it.',
      'Add one new action each round.',
      'Switch roles and copy your child’s patterns too.'
    ],
    supports: 'Practises listening, sequencing, working memory, and coordination.',
    easier: 'Use two actions and repeat them slowly.',
    harder: 'Use cross-body movements or add pauses that must be remembered.',
    silly: 'Mix in animal noises, eyebrow wiggles, or dramatic bows.',
    parentEffort: 'low',
  },
  {
    id: 'cup-code',
    title: 'Cup Code',
    summary: 'Copy and extend simple cup patterns to crack the secret code.',
    ageMin: 5,
    ageMax: 8,
    duration: 10,
    locations: ['home'],
    materials: ['cups'],
    skills: ['spatial', 'problem-solving', 'numbers'],
    energy: 'calm',
    challenge: 2,
    setupMinutes: 1,
    instructions: [
      'Use 4–8 plastic cups.',
      'Build a small arrangement and ask your child to copy it.',
      'Then create a repeating pattern: upright, upside-down, upright, upside-down.',
      'Ask what should come next and let your child create a code for you.'
    ],
    supports: 'Practises spatial matching, pattern recognition, prediction, and planning.',
    easier: 'Copy a line of three cups.',
    harder: 'Build a small 3D structure or show the model for five seconds, then cover it.',
    silly: 'Each cup becomes a tiny alien house with an absurd resident.',
    safety: 'Use plastic or paper cups rather than glass.',
    parentEffort: 'low',
  },
  {
    id: 'red-light-wiggle-light',
    title: 'Red Light, Wiggle Light',
    summary: 'Move, freeze, and switch rules on cue.',
    ageMin: 4,
    ageMax: 7,
    duration: 5,
    locations: ['home', 'outside'],
    materials: ['none'],
    skills: ['self-control', 'attention', 'movement'],
    energy: 'active',
    challenge: 1,
    setupMinutes: 0,
    instructions: [
      'Choose two cues: “green” means move and “red” means freeze.',
      'Play several quick rounds.',
      'Add “yellow” for slow motion.',
      'When that feels easy, swap the rules so red means move and green means freeze.'
    ],
    supports: 'Practises inhibition, attention, and switching between rules.',
    easier: 'Use only move and freeze.',
    harder: 'Reverse the rules or add a fourth cue such as “blue = spin once.”',
    silly: 'Move like jelly, a robot, or a confused penguin.',
    safety: 'Choose a clear area away from sharp furniture or traffic.',
    parentEffort: 'low',
  },
  {
    id: 'restaurant-detective',
    title: 'Restaurant Detective',
    summary: 'Spot tiny details around you without leaving the table.',
    ageMin: 4,
    ageMax: 8,
    duration: 10,
    locations: ['waiting'],
    materials: ['none'],
    skills: ['attention', 'language'],
    energy: 'calm',
    challenge: 1,
    setupMinutes: 0,
    instructions: [
      'Choose a detective challenge: find three round things, two things beginning with B, or something nobody else noticed.',
      'Take turns choosing challenges.',
      'Ask your child to describe the clue without pointing.',
      'Guess what they found.'
    ],

function score(g,f=filters){let p=profile(),h=state.history.filter(x=>x.profileId===p.id),s=0,reasons=[];if(f.age>=g.ageMin&&f.age<=g.ageMax){s+=9;reasons.push(`good fit for age ${f.age}`)}else s-=8*Math.min(Math.abs(f.age-g.ageMin),Math.abs(f.age-g.ageMax));if(g.duration===f.duration){s+=6;reasons.push(`fits ${g.duration} minutes`)}else if(g.duration<f.duration)s+=2;else s-=4;if(g.locations.includes(f.location)){s+=7;reasons.push('works in this setting')}else s-=14;if(g.materials.includes('none')){s+=f.materials.length?3:5;reasons.push('no materials needed')}else if(f.materials.length&&g.materials.some(m=>f.materials.includes(m))){s+=5;reasons.push('uses what you have')}else s-=f.materials.length?6:2;if(f.skill&&g.skills.includes(f.skill)){s+=9;reasons.push('matches your skill focus')}if(f.energy&&g.energy===f.energy){s+=4;reasons.push(`${g.energy} energy`)}if(f.quietOnly&&g.energy==='active')s-=7;s+=4-Math.abs(g.challenge-p.challengePreference)*3;if(g.challenge===p.challengePreference)reasons.push('matched challenge level');if(p.preferredEnergy!=='mixed'&&g.energy===p.preferredEnergy)s+=2;if(h.slice(0,5).some(x=>x.gameId===g.id))s-=5;h.filter(x=>x.gameId===g.id).slice(0,4).forEach(x=>{if(x.feedback==='not-for-us')s-=20;if(x.feedback==='lost-interest')s-=7;if(x.feedback==='loved')s+=2;if(x.feedback==='play-again')s+=5;if(x.feedback==='too-hard')s-=3});return {g,s,reasons,why:(reasons.slice(0,2).join(' and ')||'a balanced match for this play moment')+'.'}}

function card(x,i=0){let g=x.g||x;let reasons=x.reasons||[`${g.duration} min`,challenge[g.challenge]],why=x.why||`Saved for easy repeat play. Practises ${skills[g.skills[0]].toLowerCase()}.`;return `<article class="card"><div class="cardtop"><span class="rank">${skillEmoji[g.skills[0]]}</span><span class="cardlabel">Skill-focused play</span><button class="heart" onclick="event.stopPropagation();fav('${g.id}')">${state.favourites.includes(g.id)?'♥':'♡'}</button></div><div class="metainline"><span>${challenge[g.challenge]}</span><span>${energy[g.energy]}</span><span>${g.setupMinutes===0?'Ready now':g.setupMinutes+' min setup'}</span></div><h2>${g.title}</h2><p class="muted">${g.summary}</p><div class="skillblock"><span class="skilllabel">Practises</span><div class="tags">${g.skills.slice(0,3).map(s=>`<span class="skilltag">${skillEmoji[s]} ${skills[s]}</span>`).join('')}</div></div><div class="why"><strong>Why it fits:</strong> ${why}</div><div class="tags">${reasons.slice(0,3).map(r=>`<span class="softtag">${r}</span>`).join('')}</div><button class="cardaction" onclick="openGame('${g.id}')"><span>Open play guide</span><span>→</span></button></article>`}
function openGame(id){current=games.find(g=>g.id===id);let g=current;render(`<div class="topbar"><button class="iconbtn" onclick="results()">‹</button><span>How to play</span><button class="iconbtn" onclick="fav('${g.id}')">${state.favourites.includes(g.id)?'♥':'♡'}</button></div><main class="page"><section class="gamehero"><div class="gameicon">${skillEmoji[g.skills[0]]}</div><span class="eyebrow">Skill-focused play · ${g.ageMin}–${g.ageMax} years</span><h1>${g.title}</h1><p class="muted">${g.summary}</p><div class="metagrid"><div class="metabox"><span>Challenge</span><strong>${challenge[g.challenge]}</strong></div><div class="metabox"><span>Energy</span><strong>${energy[g.energy]}</strong></div><div class="metabox"><span>Ready in</span><strong>${g.setupMinutes===0?'Seconds':g.setupMinutes+' min'}</strong></div><div class="metabox"><span>Parent effort</span><strong>${g.parentEffort==='low'?'Very low':'A little help'}</strong></div></div></section><section class="skillpanel"><span class="eyebrow">What it practises</span><h2>Skills in this game</h2><div class="tags">${g.skills.map(s=>`<span class="skilltag">${skillEmoji[s]} ${skills[s]}</span>`).join('')}</div><p class="muted">${g.supports}</p></section><section class="info"><h2>You need</h2><p>${g.materials.includes('none')?'Nothing at all.':g.materials.map(m=>mats[m]).join(', ')}</p><small class="muted">Setup: ${g.setupMinutes===0?'ready almost immediately':`about ${g.setupMinutes} minute${g.setupMinutes===1?'':'s'}`}.</small>${g.materials.includes('none')?'':`<br><button class="inlineaction" onclick="alternative('${g.id}')">I don’t have this — suggest another</button>`}</section><section class="info"><h2>How to play</h2><ol class="steps">${g.instructions.map((s,i)=>`<li><span class="num">${i+1}</span><span>${s}</span></li>`).join('')}</ol></section><div class="variations"><div class="variation"><strong>Make it easier</strong><p>${g.easier}</p></div><div class="variation"><strong>Make it harder</strong><p>${g.harder}</p></div><div class="variation wide"><strong>Make it playful</strong><p>${g.silly}</p></div></div>${g.safety?`<p class="muted"><strong>Safety:</strong> ${g.safety}</p>`:''}<div class="evidence">🌱 <span>These games are for play, not assessment. They can help children practise skills, but they do not diagnose or measure development.</span></div><section class="feedback"><span class="eyebrow">After you play</span><h2>How did it feel?</h2><p>This quietly improves future recommendations — without scoring your child.</p><div class="feedbackgrid">${[['loved','Loved it'],['play-again','Play again'],['too-easy','Too easy'],['too-hard','Too hard'],['lost-interest','Lost interest'],['not-for-us','Not for us']].map(x=>`<button onclick="played('${x[0]}')">${x[1]}</button>`).join('')}</div></section></main>`)}
function alternative(id){let g=games.find(x=>x.id===id),f={...filters,age:profile().age,skill:g.skills[0],materials:[]},r=recs(f,1,id)[0];if(r)openGame(r.g.id);else setup()}
function fav(id){state.favourites=state.favourites.includes(id)?state.favourites.filter(x=>x!==id):[...state.favourites,id];save();if(current&&current.id===id)openGame(id);else saved()}
function played(feedback){let p=profile(),delta=feedback==='too-easy'?1:feedback==='too-hard'?-1:0;if(delta)p.challengePreference=Math.max(1,Math.min(3,p.challengePreference+delta));state.history.unshift({gameId:current.id,profileId:p.id,playedAt:new Date().toISOString(),feedback});state.history=state.history.slice(0,150);save();home()}
function saved(){let q=savedQuery.toLowerCase(),list=games.filter(g=>state.favourites.includes(g.id)&&(!q||(g.title+' '+g.summary+' '+g.skills.map(s=>skills[s]).join(' ')).toLowerCase().includes(q)));render(`<div class="topbar"><button class="iconbtn" onclick="home()">‹</button><span>Saved games</span><span></span></div><main class="page"><section class="intro"><span class="eyebrow">Your play toolkit</span><h1>Games worth repeating.</h1><p class="muted">Repeat favourites, then use the harder version when the challenge feels comfortable.</p></section><label class="search">⌕&nbsp;<input placeholder="Search saved games or skills" value="${savedQuery}" oninput="savedQuery=this.value;saved()"></label><div class="cards">${list.length?list.map(g=>card(g)).join(''):`<div class="empty">${savedQuery?'No saved match. Try another search.':'Nothing saved yet. Tap the heart on games you want to keep.'}</div>`}</div></main>`,'saved')}
function profileScreen(){let p=profile();render(`<div class="topbar"><button class="iconbtn" onclick="home()">‹</button><span>Child profile</span><button class="iconbtn" onclick="addProfile()">＋</button></div><main class="page"><section class="intro"><span class="eyebrow">Child profile</span><h1>Help us suggest better games.</h1><p class="muted">A few simple preferences help us suggest better games. Nothing here is a score or assessment.</p></section>${state.profiles.length>1?`<div class="profileswitch">${state.profiles.map(x=>`<button class="${x.id===p.id?'sel':''}" onclick="switchProfile('${x.id}')">${x.name||`Age ${x.age}`}</button>`).join('')}</div>`:''}${q('What should we call them?','Optional — this stays on this device in the MVP.',`<input class="textinput" value="${p.name}" placeholder="e.g. Maya" oninput="updateName(this.value)">`)}${q('Age','',`<div class="age">${[4,5,6,7,8].map(a=>`<button class="choice ${p.age===a?'sel':''}" onclick="updateProfile('age',${a})">${a}</button>`).join('')}</div>`)}${q('Preferred play energy','A gentle nudge, not a fixed rule.',`<div class="grid four">${['mixed','calm','medium','active'].map(e=>`<button class="choice ${p.preferredEnergy===e?'sel':''}" onclick="updateProfile('preferredEnergy','${e}')">${e==='mixed'?'Mixed':energy[e]}</button>`).join('')}</div>`)}<div class="profileinsight">◫ <div><strong>Current difficulty: ${challenge[p.challengePreference]}</strong><p class="muted">This changes when you mark games as too easy or too hard.</p></div></div></main>`,'profile')}
function updateName(v){profile().name=v.slice(0,24);save()}
function updateProfile(k,v){profile()[k]=v;filters.age=profile().age;save();profileScreen()}
function switchProfile(id){state.activeProfileId=id;filters.age=profile().age;save();profileScreen()}
function addProfile(){let id='child-'+Date.now();state.profiles.push({id,name:'',age:5,interests:[],preferredEnergy:'mixed',challengePreference:2});state.activeProfileId=id;filters.age=5;save();profileScreen()}
home();
</script></body></html>
