<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SmartRoom — MVP</title>
<style>
  :root{
    --bg:#f7f3ee;
    --card:#fffdfa;
    --ink:#2e2b2a;
    --muted:#7c7773;
    --border:#e8e0d9;
    --rose:#ead1d6;
    --rose-deep:#b76f80;
    --sage:#dbe6d5;
    --sage-deep:#6f8a68;
    --lav:#e3dff0;
    --blue:#dce8ef;
    --peach:#f2dfcd;
    --cream:#fbf4e8;
    --shadow:0 12px 30px rgba(68,55,45,.08);
    --radius:24px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif}
  body{min-height:100vh}
  button,input,select{font:inherit}
  button{cursor:pointer}
  .app-shell{max-width:460px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#fbf8f4 0%,#f7f3ee 100%);position:relative;padding-bottom:92px}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(251,248,244,.94);backdrop-filter:blur(16px);padding:16px 18px 10px;border-bottom:1px solid rgba(232,224,217,.65)}
  .brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:850;letter-spacing:-.03em;font-size:22px}
  .profile-btn{width:42px;height:42px;border:none;border-radius:50%;background:var(--sage);color:var(--ink);font-weight:800;display:grid;place-items:center}
  .content{padding:18px}
  .screen{display:none}
  .screen.active{display:block}
  h1,h2,h3,p{margin-top:0}
  h1{font-size:28px;line-height:1.08;letter-spacing:-.035em;margin-bottom:8px}
  h2{font-size:20px;letter-spacing:-.025em;margin-bottom:10px}
  h3{font-size:16px;margin-bottom:6px}
  .subtle{color:var(--muted);font-size:14px;line-height:1.45}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--sage-deep);margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .section{margin-bottom:18px}
  .btn{border:0;border-radius:16px;padding:13px 16px;font-weight:800;min-height:46px}
  .btn-primary{background:var(--ink);color:white}
  .btn-soft{background:var(--sage);color:var(--ink)}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink)}
  .btn-rose{background:var(--rose);color:var(--ink)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn-row .btn{flex:1;min-width:120px}
  .icon-btn{border:none;background:#fff;border:1px solid var(--border);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:7px 10px;background:#f3efeb;border:1px solid #ece5df;font-size:12px;font-weight:750;margin:3px 4px 3px 0}
  .pill button{border:none;background:transparent;padding:0;font-size:13px;color:var(--muted)}
  .divider{height:1px;background:var(--border);margin:16px 0}
  .toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%) translateY(12px);background:#2f2b29;color:#fff;padding:11px 14px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:380px;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* onboarding */
  .onboarding{padding:26px 18px 40px}
  .hero-mark{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--rose),var(--sage));display:grid;place-items:center;font-size:26px;margin-bottom:18px}
  .stepper{display:flex;gap:7px;margin:20px 0}
  .step-dot{height:6px;flex:1;border-radius:999px;background:#e8dfd8}
  .step-dot.active{background:var(--ink)}
  .form-card{padding:18px}
  label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
  input[type="text"],input[type="number"],select{width:100%;border:1px solid var(--border);background:#fff;border-radius:14px;padding:13px 14px;color:var(--ink);font-size:16px;outline:none}
  input:focus,select:focus{border-color:#a9bda1;box-shadow:0 0 0 3px rgba(111,138,104,.12)}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 12px;font-weight:700;color:var(--ink)}
  .chip.selected{background:var(--sage);border-color:#bfd0b6}
  .chip.small{padding:8px 10px;font-size:13px}

  /* discover */
  .discover-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .mini-map{background:var(--sage);padding:10px 12px;border-radius:16px;font-size:12px;line-height:1.3;max-width:150px}
  .product-card{overflow:hidden;touch-action:pan-y;transition:transform .2s ease,opacity .2s ease}
  .product-visual{height:220px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,var(--peach),var(--lav))}
  .product-visual .emoji{font-size:88px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.08))}
  .price-badge{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);padding:8px 11px;border-radius:999px;font-size:13px;font-weight:850}
  .match-badge{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.9);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800;color:var(--sage-deep)}
  .product-body{padding:18px}
  .product-title-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .product-name{font-size:23px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
  .product-meta{font-size:13px;color:var(--muted);margin-top:4px}
  .reason-box{border-radius:18px;padding:13px 14px;background:#f5f0eb;margin:12px 0}
  .reason-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#8f877f;margin-bottom:4px}
  .reason-text{font-size:14px;line-height:1.45}
  .action-row{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:14px}
  .secondary-actions{display:flex;justify-content:center;gap:8px;margin-top:10px}
  .secondary-actions button{border:0;background:transparent;color:var(--muted);font-weight:750;padding:9px}
  .deck-empty{padding:30px 20px;text-align:center}

  /* playroom */
  .summary-card{padding:18px;background:linear-gradient(135deg,#fff,var(--cream))}
  .stat-row{display:flex;gap:12px;margin-top:14px}
  .stat{flex:1;background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px}
  .stat strong{display:block;font-size:20px}
  .stat span{font-size:12px;color:var(--muted)}
  .owned-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .owned-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px;min-width:0}
  .owned-item .oemoji{font-size:27px}
  .owned-item .otext{min-width:0;flex:1}
  .owned-item .otitle{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .owned-item .osub{font-size:11px;color:var(--muted);margin-top:2px}
  .owned-item .remove{border:none;background:transparent;color:#9b8f87;font-size:18px}
  .playmap{padding:18px}
  .map-row{display:grid;grid-template-columns:120px 1fr 72px;gap:10px;align-items:center;margin:11px 0}
  .map-label{font-size:13px;font-weight:800}
  .bar{height:10px;border-radius:999px;background:#eee8e2;overflow:hidden}
  .bar > span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#9eb793,#c2d5b9)}
  .map-state{font-size:11px;color:var(--muted);text-align:right}
  .next-focus{margin-top:14px;padding:13px 14px;border-radius:18px;background:var(--sage)}
  .add-panel,.bundle-panel,.share-panel,.profile-panel{display:none;margin-top:14px;padding:16px}
  .add-panel.show,.bundle-panel.show,.share-panel.show,.profile-panel.show{display:block}

  /* wishes */
  .wish-card{display:flex;gap:12px;padding:13px;margin-bottom:10px;align-items:center}
  .wish-thumb{width:74px;height:74px;border-radius:18px;display:grid;place-items:center;background:var(--lav);font-size:38px;flex:0 0 auto}
  .wish-main{min-width:0;flex:1}
  .wish-name{font-weight:850;line-height:1.2}
  .wish-meta{font-size:12px;color:var(--muted);margin:4px 0}
  .wish-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
  .wish-actions button{border:none;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:800;background:#f2ece7}
  .reserved{background:var(--sage)!important}

  /* bundle */
  .bundle-card{padding:16px;margin-top:12px}
  .bundle-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
  .bundle-item:last-child{border-bottom:0}
  .bundle-emoji{width:48px;height:48px;border-radius:14px;background:var(--blue);display:grid;place-items:center;font-size:27px;flex:0 0 auto}
  .bundle-main{flex:1;min-width:0}
  .bundle-name{font-weight:850;font-size:13px}
  .bundle-skills{font-size:11px;color:var(--muted);margin-top:3px}
  .bundle-swap{border:1px solid var(--border);background:#fff;border-radius:11px;padding:8px 10px;font-size:11px;font-weight:800}

  /* bottom nav */
  .bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,253,250,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .nav-btn{border:none;background:transparent;border-radius:16px;padding:9px 6px;color:#8e8580;font-size:11px;font-weight:800;min-height:58px}
  .nav-btn span{display:block;font-size:20px;margin-bottom:3px}
  .nav-btn.active{background:var(--sage);color:var(--ink)}

  /* dialogs */
  dialog{border:none;border-radius:24px;padding:0;max-width:380px;width:calc(100% - 34px);background:var(--card);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.22)}
  dialog::backdrop{background:rgba(42,37,34,.35);backdrop-filter:blur(3px)}
  .dialog-body{padding:20px}
  .dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .dialog-close{border:none;background:#f1ece8;border-radius:12px;width:38px;height:38px;font-size:18px}
  .gift-view{padding:18px}
  .gift-header{background:linear-gradient(135deg,var(--rose),var(--cream));border-radius:20px;padding:16px;margin-bottom:14px}

  @media (max-width:360px){
    .content{padding:14px}.map-row{grid-template-columns:105px 1fr 58px}.product-visual{height:195px}.product-visual .emoji{font-size:76px}.owned-grid{grid-template-columns:1fr}.discover-head{display:block}.mini-map{margin-top:10px;max-width:none}
  }


  /* v2 refinements */
  a{color:inherit;text-decoration:none}
  .welcome-wrap{padding:28px 18px 46px;min-height:100vh;background:
    radial-gradient(circle at 88% 8%,rgba(219,230,213,.9),transparent 28%),
    radial-gradient(circle at 8% 34%,rgba(234,209,214,.72),transparent 24%),
    linear-gradient(180deg,#fffaf7 0%,#f7f3ee 100%)}
  .welcome-logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.03em;font-size:22px;margin-bottom:38px}
  .welcome-logo-mark{width:42px;height:42px;border-radius:15px;background:linear-gradient(135deg,var(--rose),var(--sage));display:grid;place-items:center}
  .welcome-title{font-size:42px;line-height:.98;letter-spacing:-.055em;max-width:390px;margin-bottom:14px}
  .welcome-copy{font-size:17px;line-height:1.5;color:#69635f;max-width:390px}
  .hero-products{height:235px;position:relative;margin:20px 0 24px}
  .hero-product{position:absolute;width:144px;height:184px;background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 20px 45px rgba(58,45,37,.12);padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .hero-product img{width:100%;height:100%;object-fit:contain}
  .hero-product.hp1{left:50%;top:14px;transform:translateX(-50%) rotate(-2deg);z-index:3}
  .hero-product.hp2{left:18px;top:38px;transform:rotate(-10deg);z-index:1}
  .hero-product.hp3{right:18px;top:38px;transform:rotate(10deg);z-index:2}
  .welcome-points{display:grid;gap:10px;margin:18px 0 22px}
  .welcome-point{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid rgba(232,224,217,.8)}
  .welcome-point:first-child{border-top:0}
  .welcome-point-icon{width:34px;height:34px;border-radius:12px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;flex:0 0 auto}
  .welcome-point strong{font-size:14px;display:block;margin-bottom:2px}
  .welcome-point span{font-size:12px;color:var(--muted);line-height:1.4}
  .onboarding .hero-mark{box-shadow:0 10px 25px rgba(58,45,37,.08)}
  .discover-head.simple{display:block;margin-bottom:14px}
  .discover-head.simple h1{margin-bottom:6px}
  .product-visual{height:250px;background:linear-gradient(180deg,#fff,#faf7f2);overflow:hidden}
  .product-visual img{width:100%;height:100%;object-fit:contain;padding:18px;display:block}
  .product-fallback{display:none;width:100%;height:100%;place-items:center;font-size:84px}
  .amazon-badge{position:absolute;top:14px;right:14px;background:#fff7dc;border:1px solid #efdfaf;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:900}
  .swipe-cue{text-align:center;color:var(--muted);font-size:12px;font-weight:750;margin:10px 0 0}
  @keyframes swipeNudge{
    0%,100%{transform:translateX(0) rotate(0)}
    20%{transform:translateX(11px) rotate(1.5deg)}
    50%{transform:translateX(0) rotate(0)}
    80%{transform:translateX(-11px) rotate(-1.5deg)}
  }
  .product-card.swipe-hint-active{animation:swipeNudge 1.55s ease-in-out .45s 2;transform-origin:50% 86%}
  .swipe-stamp{position:absolute;top:78px;padding:8px 12px;border-radius:12px;border:3px solid currentColor;font-weight:950;letter-spacing:.07em;text-transform:uppercase;opacity:0;z-index:3;background:rgba(255,255,255,.88);pointer-events:none}
  .swipe-stamp.like{right:18px;color:#6f8a68;transform:rotate(8deg)}
  .swipe-stamp.nope{left:18px;color:#b76f80;transform:rotate(-8deg)}
  .amazon-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:8px 10px;background:#fff1c9;color:#3b352d;font-size:11px;font-weight:900;border:1px solid #eddca7}
  .amazon-link.big{min-height:46px;border-radius:16px;padding:12px 15px;font-size:13px}
  .playroom-overview{padding:18px}
  .existing-section{margin-top:14px}
  .existing-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#8f877f;margin-bottom:9px}
  .mini-owned-list{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}
  .mini-owned-list::-webkit-scrollbar{display:none}
  .owned-chip{display:inline-flex;align-items:center;gap:7px;background:#f7f2ed;border:1px solid var(--border);border-radius:999px;padding:8px 10px;white-space:nowrap;font-size:12px;font-weight:800}
  .owned-chip .x{border:0;background:transparent;color:#9b8f87;font-size:15px;padding:0;line-height:1}
  .activity-chip{background:#eef3ea}
  .feature-action{width:100%;border:1px solid var(--border);background:var(--card);border-radius:22px;padding:15px 16px;display:flex;align-items:center;gap:13px;text-align:left;box-shadow:var(--shadow);color:var(--ink)}
  .feature-action + .feature-action{margin-top:10px}
  .feature-icon{width:44px;height:44px;border-radius:15px;background:var(--rose);display:grid;place-items:center;font-size:21px;flex:0 0 auto}
  .feature-action.green .feature-icon{background:var(--sage)}
  .feature-action strong{display:block;font-size:15px;margin-bottom:3px}
  .feature-action span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
  .feature-chevron{margin-left:auto;color:#a59b94;font-size:22px}
  .playmap{margin-top:14px}
  .next-skills{margin-top:9px}
  .modal-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .modal-choice{border:1px solid var(--border);background:#fff;border-radius:18px;padding:16px;text-align:left;min-height:110px}
  .modal-choice .mi{font-size:28px;margin-bottom:12px}
  .modal-choice strong{display:block;font-size:15px;margin-bottom:4px}
  .modal-choice span{font-size:12px;color:var(--muted);line-height:1.35}
  .category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
  .category-btn{border:1px solid var(--border);background:#fff;border-radius:16px;padding:12px;text-align:left;font-weight:800;min-height:58px}
  .modal-back{border:0;background:transparent;padding:0;color:var(--muted);font-weight:800;margin-bottom:12px}
  .custom-add{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .custom-row{display:grid;grid-template-columns:1fr auto;gap:8px}
  .custom-row .btn{min-width:74px}
  .wish-thumb{overflow:hidden;background:#fff}
  .wish-thumb img{width:100%;height:100%;object-fit:contain;padding:5px}
  .bundle-emoji{overflow:hidden;background:#fff;border:1px solid var(--border)}
  .bundle-emoji img{width:100%;height:100%;object-fit:contain;padding:4px}
  .bundle-buy{display:flex;gap:8px;align-items:center}
  .retailer-note{font-size:10px;color:var(--muted);line-height:1.35;margin-top:8px;text-align:center}
  .source-note{font-size:10px;color:var(--muted);margin-top:18px;line-height:1.4}
  @media(max-width:360px){.welcome-title{font-size:36px}.hero-product{width:126px;height:166px}.hero-products{height:215px}.product-visual{height:220px}.modal-choice-grid{grid-template-columns:1fr}}

  /* v3 wishes + sharing */
  .wish-cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .wish-cta{min-height:42px;border-radius:13px;border:1px solid var(--border);font-weight:850;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;text-align:center;background:#fff;color:var(--ink)}
  .wish-cta.amazon{background:#fff4d6;border-color:#ead9a6}
  .wish-cta.share{background:var(--sage);border-color:#bfd0b6}
  .wish-remove{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:750;padding:6px 0 0;text-decoration:underline;text-underline-offset:2px}
  .wishes-footer-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .wishes-footer-actions .feature-action{min-height:86px;padding:14px}
  .wishes-footer-actions .feature-icon{width:40px;height:40px;font-size:19px}
  .wishes-footer-actions .feature-action strong{font-size:13px}
  .wishes-footer-actions .feature-action span{font-size:11px}
  .share-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .share-method{border:1px solid var(--border);background:#fff;border-radius:18px;padding:15px;text-align:left}
  .share-method.selected{background:var(--sage);border-color:#bfd0b6}
  .share-method strong{display:block;margin-top:8px}
  .share-method span{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35}
  .share-fields{margin-top:12px}
  .share-preview{margin-top:12px;padding:12px 13px;border-radius:15px;background:#f6f1ec;font-size:12px;line-height:1.45;color:#5f5853}
  @media(max-width:360px){.wishes-footer-actions{grid-template-columns:1fr}.wish-cta-grid{grid-template-columns:1fr 1fr}}

  /* v4 SmartRoom refinements */
  .btn-skip{background:var(--lav);color:var(--ink);border:1px solid #cec6e0}
  .btn-wish{background:var(--sage);color:var(--ink);border:1px solid #bfd0b6}
  .btn-skip:hover,.btn-wish:hover{filter:brightness(.985)}
  .wishes-footer-actions .feature-action + .feature-action{margin-top:0}
  .wishes-footer-actions .feature-action{height:100%;min-height:96px;align-items:flex-start}
  .wishes-footer-actions .feature-action.share-all{background:var(--sage);border-color:#bfd0b6}
  .wishes-footer-actions .feature-action.discover-more{background:var(--lav);border-color:#cec6e0}
  .wishes-footer-actions .feature-action.share-all .feature-icon{background:#f3f7f0}
  .wishes-footer-actions .feature-action.discover-more .feature-icon{background:#f5f2fb}
  .wishes-map-card{width:100%;border:1px solid var(--border);background:linear-gradient(135deg,#fff,var(--cream));border-radius:22px;padding:16px;display:flex;gap:13px;align-items:center;text-align:left;color:var(--ink);box-shadow:var(--shadow);margin:0 0 12px}

    inhibition:['Inhibitory control','Pausing an automatic response and following a rule instead — for example waiting for a turn or stopping when a game says “freeze.”'],

    problemSolving:['Problem solving','Trying possibilities, noticing what works and changing approach when a first idea does not solve the problem.'],
    spatial:['Spatial reasoning','Understanding how shapes, objects and spaces relate to one another. It appears naturally in building, puzzles and navigation.'],

  const skillLabels = Object.fromEntries(Object.entries(skillInfo).map(([k,v])=>[k,v[0]]));

  const broadSkillGroups = {

  const interests = ['Animals','Building','Cars','Dinosaurs','Drawing','Stories','Nature','Sports','Music','Pretend play','Science','Space','Numbers','Puzzles'];

    'Football':{coordination:5,bodyAwareness:4,motorPlanning:4,cooperation:4,attention:3,planning:2},
    'Dance':{coordination:5,bodyAwareness:5,motorPlanning:4,workingMemory:2,creativity:2},
    'Gymnastics':{coordination:5,bodyAwareness:5,motorPlanning:5,attention:3,patience:2},
    'Music':{attention:4,workingMemory:4,patterns:4,coordination:2,patience:3},
    'Martial arts':{inhibition:5,attention:4,coordination:4,bodyAwareness:4,patience:4},
    'Cycling':{coordination:5,bodyAwareness:4,motorPlanning:4,attention:3,planning:2},
    'Theatre':{language:4,storytelling:5,creativity:5,cooperation:4,flexibility:3},
    'Scouts':{cooperation:4,planning:4,problemSolving:4,bodyAwareness:2,creativity:2},
    'Outdoor play':{bodyAwareness:4,coordination:3,creativity:3,problemSolving:2,cooperation:2}
  };

  const products = [
    {id:'outfoxed',name:'Outfoxed!',emoji:'🦊',desc:'Cooperative whodunit board game',age:[5,8],price:25,group:'cooperative-board',interests:['Animals','Puzzles','Stories'],skills:{cooperation:5,problemSolving:5,attention:4,planning:3,workingMemory:3},image:'https://www.steamrocket.co.uk/cdn/shop/products/outfoxed-cooperative-kids-family-game-gamewright-boxcopy_300x.jpg?v=1619746478',amazon:'https://www.amazon.de/s?k=Gamewright+Outfoxed+board+game'},
    {id:'dobblekids',name:'Dobble Kids',emoji:'🔎',desc:'Fast visual matching card game',age:[4,8],price:14,group:'visual-card',interests:['Animals','Puzzles'],skills:{attention:5,workingMemory:3,inhibition:3,patterns:3},image:'https://cdn.svc.asmodee.net/production-asmodeeit/uploads/image-converter/2022/09/DOKI_SETUP_20231113-1024x627.webp',amazon:'https://www.amazon.de/s?k=Dobble+Kids+Asmodee'},
    {id:'squirrels',name:'Squirrels Go Nuts!',emoji:'🐿️',desc:'Single-player sliding logic puzzle',age:[6,8],price:18,group:'logic',interests:['Animals','Puzzles'],skills:{planning:5,problemSolving:5,spatial:4,attention:4,workingMemory:2},image:'https://mp-sellers-files.danubehome.com/sellers/KLUG-TOYS/pi/179900097876/image_1727281269237.jpeg',amazon:'https://www.amazon.de/s?k=SmartGames+Squirrels+Go+Nuts'},
    {id:'rushhourjr',name:'Rush Hour Junior',emoji:'🚗',desc:'Traffic-jam logic game by ThinkFun',age:[5,8],price:25,group:'logic',interests:['Cars','Puzzles'],skills:{planning:5,problemSolving:5,spatial:5,attention:4,workingMemory:3},image:'https://m.media-amazon.com/images/I/81DVjxytyLL._AC_SL1500_.jpg',amazon:'https://www.amazon.de/s?k=ThinkFun+Rush+Hour+Junior'},
    {id:'animaluponanimal',name:'Animal Upon Animal',emoji:'🐊',desc:'Wooden stacking game by HABA',age:[4,8],price:25,group:'dexterity',interests:['Animals'],skills:{fineMotor:5,coordination:4,planning:3,patience:4,inhibition:2},image:'https://www.bellalunatoys.com/cdn/shop/files/games-animal-upon-animal-3678-ls1_7193e17e-3ef5-40ba-b72a-631f6f42b21f.jpg?v=1743540453&width=1000',amazon:'https://www.amazon.de/s?k=HABA+Animal+Upon+Animal'},
    {id:'ticketfirst',name:'Ticket to Ride: First Journey',emoji:'🚂',desc:'Junior route-building strategy game',age:[6,8],price:30,group:'strategy-board',interests:['Cars','Stories','Puzzles'],skills:{planning:5,workingMemory:3,patterns:3,attention:3,problemSolving:3},image:'https://cdn.svc.asmodee.net/production-asmodeeca/uploads/image-converter/2022/01/EN-TICKET_TO_RIDE-FIRST_JOURNEY-EUROPE-L.webp',amazon:'https://www.amazon.de/s?k=Ticket+to+Ride+First+Journey+Europe'},
    {id:'zingo',name:'Zingo!',emoji:'🔤',desc:'Picture-and-word matching game',age:[4,8],price:25,group:'language-game',interests:['Stories','Numbers'],skills:{language:5,attention:4,patterns:4,inhibition:3,workingMemory:3},image:'https://www.bigw.com.au/medias/sys_master/images/images/hb7/h95/138157100171294.jpg',amazon:'https://www.amazon.de/s?k=ThinkFun+Zingo'},
    {id:'storycubes',name:"Rory's Story Cubes Classic",emoji:'🎲',desc:'Storytelling dice for open-ended imagination',age:[6,8],price:15,group:'storytelling',interests:['Stories','Pretend play'],skills:{storytelling:5,language:5,creativity:5,flexibility:4,cooperation:2},image:'https://cdn.svc.asmodee.net/production-asmodeeca/uploads/image-converter/2022/01/ML-RSC-CLASSIC-L.webp',amazon:'https://www.amazon.de/s?k=Rory%27s+Story+Cubes+Classic'},
    {id:'iqpuzzler',name:'IQ Puzzler Pro',emoji:'🧠',desc:'120 compact 2D and 3D logic challenges',age:[6,8],price:15,group:'logic',interests:['Puzzles','Numbers'],skills:{planning:5,problemSolving:5,spatial:5,attention:5,workingMemory:3},image:'https://smartgamesusa.com/sites/default/files/smartgames-product-banner_IQ-Puzzler-Pro_0.jpg',amazon:'https://www.amazon.de/s?k=SmartGames+IQ+Puzzler+Pro'},
    {id:'juniorlabyrinth',name:'Junior Labyrinth',emoji:'🌀',desc:'Ravensburger shifting-maze strategy game',age:[5,8],price:22,group:'strategy-board',interests:['Puzzles','Stories'],skills:{planning:4,spatial:5,problemSolving:4,attention:4,workingMemory:2},image:'https://m.media-amazon.com/images/I/61V+zdyHLQL._AC_SL1024_.jpg',amazon:'https://www.amazon.de/Ravensburger-Kinderspiele-21210-Junior-Labyrinth/dp/B0000TZ4VG'},
    {id:'conceptkids',name:'Concept Kids: Animals',emoji:'🐯',desc:'Cooperative animal guessing game',age:[4,8],price:28,group:'cooperative-board',interests:['Animals','Stories'],skills:{language:5,cooperation:5,flexibility:4,attention:3,problemSolving:3},image:'https://shop.steamda.com/cdn/shop/files/CONC02-image2_2000_720x_1089ba4b-8c0f-458f-a35f-2b19bbd5b05b.webp?v=1705118599&width=1445',amazon:'https://www.amazon.de/s?k=Concept+Kids+Animals+Asmodee'}
  ];

  const defaults = {
    onboardingStep:-1,
    profile:{name:'',age:6,interests:[],activities:[]},
    playroom:[],
    wishes:[],
    skipped:[],
    reserved:[],
    currentProductId:null,
    activeScreen:'discover',
    completed:false,
    bundle:[],
    bundleBudget:150,
    customItems:[],
    customActivities:[],
    seenSwipeHint:false
  };

  function loadState(){
    try{
      const raw = localStorage.getItem('smartroom_mvp_v4');
      if(!raw) return structuredClone(defaults);
      const parsed = JSON.parse(raw);
      return Object.assign(structuredClone(defaults), parsed, {profile:Object.assign({},defaults.profile,parsed.profile||{})});
    }catch(e){ return structuredClone(defaults); }
  }
  let state = loadState();
  function save(){ try{ localStorage.setItem('smartroom_mvp_v4',JSON.stringify(state)); }catch(e){} }
  function escapeHtml(str){ return String(str??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function showToast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(showToast.t); showToast.t=setTimeout(()=>toastEl.classList.remove('show'),1800); }
  function initials(){ return (state.profile.name||'S').trim().charAt(0).toUpperCase() || 'S'; }

  function allSkillKeys(){ return Object.keys(skillInfo); }
  function emptyScores(){ return Object.fromEntries(allSkillKeys().map(k=>[k,0])); }
  function addScores(target,src,mult=1){ Object.entries(src||{}).forEach(([k,v])=>{ if(target[k]!==undefined) target[k]+=Number(v)*mult; }); }

  function customItemById(id){ return (state.customItems||[]).find(x=>x.id===id); }
  function ownedItemById(id){ return playroomLibrary.find(x=>x.id===id)||products.find(x=>x.id===id)||customItemById(id); }
  function getPlayMap(extraProducts=[]){
    const scores=emptyScores();
    state.playroom.forEach(id=>{ const item=ownedItemById(id); if(item) addScores(scores,item.skills,1); });
    (state.profile.activities||[]).forEach(a=>addScores(scores,activitySkillMap[a],1.15));
    (state.customActivities||[]).forEach(a=>addScores(scores,a.skills,1.05));
    extraProducts.forEach(p=>addScores(scores,p.skills,1));
    const values=Object.values(scores); const max=Math.max(1,...values);
    const norm={}; Object.entries(scores).forEach(([k,v])=>norm[k]=Math.round((v/max)*100));
    return {scores,norm};
  }

  function broadMap(extraProducts=[]){
    const {scores}=getPlayMap(extraProducts);
    const vals={};
    Object.entries(broadSkillGroups).forEach(([label,keys])=>vals[label]=keys.reduce((a,k)=>a+(scores[k]||0),0)/keys.length);
    const max=Math.max(1,...Object.values(vals));
    return Object.entries(vals).map(([label,v])=>({label,value:Math.round((v/max)*100),raw:v})).sort((a,b)=>b.raw-a.raw);
  }

  function broadRawFromScores(scores){
    return Object.fromEntries(Object.entries(broadSkillGroups).map(([label,keys])=>[label,keys.reduce((a,k)=>a+(scores[k]||0),0)/keys.length]));
  }

  function dominantBroadForProduct(p){
    const vals=Object.entries(broadSkillGroups).map(([label,keys])=>({label,value:keys.reduce((a,k)=>a+(p.skills?.[k]||0),0)}));
    vals.sort((a,b)=>b.value-a.value);
    return vals[0]?.label||'Other play';
  }

  function lowSkills(count=3){
    const {scores}=getPlayMap();
    return Object.entries(scores).sort((a,b)=>a[1]-b[1]).slice(0,count).map(x=>x[0]);
  }

  function ownedGroups(){
    const set=new Set();
    state.playroom.forEach(id=>{ const item=ownedItemById(id); if(item?.group) set.add(item.group); });
    return set;
  }

  function scoreProduct(p){
    const age=Number(state.profile.age)||6;
    if(age<p.age[0]||age>p.age[1]) return -9999;
    if(state.playroom.includes(p.id)||state.skipped.includes(p.id)||state.wishes.includes(p.id)) return -9999;
    let s=0;
    const likes=new Set(state.profile.interests||[]);
    p.interests.forEach(i=>{ if(likes.has(i)) s+=14; });
    const lows=lowSkills(5);
    lows.forEach((k,idx)=>{ if(p.skills[k]) s += p.skills[k]*(5-idx)*1.25; });
    if(ownedGroups().has(p.group)) s-=14;
    const similarCount=state.playroom.filter(id=>{
      const b=playroomLibrary.find(x=>x.id===id); const q=products.find(x=>x.id===id);
      return (b&&b.group===p.group)||(q&&q.group===p.group);
    }).length;
    s-=similarCount*6;
    const savedGroups=state.wishes.map(id=>products.find(x=>x.id===id)?.group).filter(Boolean);
    if(savedGroups.includes(p.group)) s+=2;
    s += (p.skills.cooperation||0)*0.3;
    return s;
  }

  function rankedProducts(){ return products.map(p=>({p,s:scoreProduct(p)})).filter(x=>x.s>-1000).sort((a,b)=>b.s-a.s); }
  function currentProduct(){
    const ranked=rankedProducts();
    if(!ranked.length) return null;
    let p=products.find(x=>x.id===state.currentProductId);

  function recommendationReason(p){

    const relevant=Object.entries(p.skills).filter(([k])=>lows.includes(k)).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>skillLabels[k]);

    if(relevant.length>=2) return `Adds more ${relevant[0].toLowerCase()} and ${relevant[1].toLowerCase()} to a play environment already strong in ${strong}.`;
    return `Adds a different kind of play while still fitting ${state.profile.name||'your child'}’s interests.`;
  }

    const matches=p.interests.filter(i=>(state.profile.interests||[]).includes(i));

    if(matches.length===1) return `Matches an interest in ${matches[0].toLowerCase()}.`;

  function generateBundle(){
    const budget=Number(state.bundleBudget)||150;
    const candidates=products.filter(p=>!state.playroom.includes(p.id) && !state.wishes.includes(p.id) && Number(state.profile.age)>=p.age[0] && Number(state.profile.age)<=p.age[1]);
    const selected=[]; let spent=0; const usedGroups=new Set(ownedGroups());
    let pool=[...candidates];
    while(selected.length<5 && pool.length){
      pool.sort((a,b)=>{
        const groupBonusA=usedGroups.has(a.group)?0:20, groupBonusB=usedGroups.has(b.group)?0:20;
        return (scoreProduct(b)+groupBonusB)-(scoreProduct(a)+groupBonusA);
      });
      let pick=pool.find(p=>spent+p.price<=budget);
      if(!pick) break;
      selected.push(pick); spent+=pick.price; usedGroups.add(pick.group); pool=pool.filter(p=>p.id!==pick.id);
    }
    state.bundle=selected.map(p=>p.id); save();
  }

    content.querySelectorAll('[data-share-method]').forEach(btn=>btn.addEventListener('click',()=>{
      shareMethod=btn.dataset.shareMethod;
      content.querySelectorAll('[data-share-method]').forEach(x=>x.classList.toggle('selected',x.dataset.shareMethod===shareMethod));
      const label=content.querySelector('#shareRecipientLabel'), input=content.querySelector('#shareRecipient'), send=content.querySelector('#sendWishShare');
      if(shareMethod==='email'){label.textContent='Email address';input.placeholder='name@example.com';input.inputMode='email';send.textContent='Open email';}
      else{label.textContent='Phone number';input.placeholder='+30 69…';input.inputMode='tel';send.textContent='Open text message';}
    }));
    content.querySelector('#sendWishShare')?.addEventListener('click',()=>{
      const isAll=sharingWishId==='__all__';
      const p=isAll?null:products.find(x=>x.id===sharingWishId); if(!isAll&&!p)return;
      const recipient=content.querySelector('#shareRecipient')?.value.trim()||'';
      const msg=isAll?allWishesShareMessage():wishShareMessage(p);
      if(shareMethod==='email'){
        const subject=isAll?`${state.profile.name||'Our child'}'s Wishes`:`Gift idea for ${state.profile.name||'our child'}: ${p.name}`;
        window.location.href=`mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg)}`;
      }else{
        const prefix=recipient?encodeURIComponent(recipient):'';
        window.location.href=`sms:${prefix}?&body=${encodeURIComponent(msg)}`;
      }
    });
  }

  function wishesMapRows(ws){
    const current=getPlayMap().scores;
    const future=getPlayMap(ws).scores;
    const curBroad=broadRawFromScores(current);
    const futBroad=broadRawFromScores(future);
    const max=Math.max(1,...Object.values(futBroad));
    return Object.keys(broadSkillGroups).map(label=>({
      label,
      current:Math.round((curBroad[label]/max)*100),
      future:Math.round((futBroad[label]/max)*100),
      delta:futBroad[label]-curBroad[label]
    })).sort((a,b)=>b.delta-a.delta);
  }

  function wishesOverlap(ws){
    const counts={};
    ws.forEach(p=>{const label=dominantBroadForProduct(p);counts[label]=(counts[label]||0)+1;});
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    if(!sorted.length||sorted[0][1]<2)return null;
    return {label:sorted[0][0],count:sorted[0][1]};
  }

  function wishesAlternative(ws,overlap){
    if(!overlap)return null;
    return rankedProducts().map(x=>x.p).find(p=>!state.wishes.includes(p.id)&&!state.playroom.includes(p.id)&&dominantBroadForProduct(p)!==overlap.label)||null;
  }

  function renderWishesMap(){
    const ws=state.wishes.map(id=>products.find(p=>p.id===id)).filter(Boolean);
    const content=document.getElementById('wishesMapContent'); if(!content)return;
    if(!ws.length){content.innerHTML='<p class="subtle">Save a few Wishes first and their map will appear here.</p>';return;}
    const rows=wishesMapRows(ws);
    const current=getPlayMap().scores, future=getPlayMap(ws).scores;
    const topSkills=Object.keys(future).map(k=>({k,d:future[k]-current[k]})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,5);
    const overlap=wishesOverlap(ws);
    const alt=wishesAlternative(ws,overlap);
    content.innerHTML=`<p class="subtle">This compares the cognitive play already represented by the Playroom and regular activities with what the saved Wishes would add.</p>
      <div class="wm-legend"><span><i class="wm-dot current"></i>Current</span><span><i class="wm-dot future"></i>With Wishes</span></div>
      <div>${rows.map(r=>`<div class="wm-row"><div class="wm-row-head"><strong>${escapeHtml(r.label)}</strong><span class="wm-delta">${r.delta>0?'adds variety':'little change'}</span></div><div class="wm-bar-track"><span class="wm-bar-future" style="width:${Math.max(4,r.future)}%"></span><span class="wm-bar-current" style="width:${Math.max(2,r.current)}%"></span></div></div>`).join('')}</div>
      <div class="divider"></div><h3>What these Wishes add most</h3><p class="subtle">Tap a skill to see which saved games contribute to it.</p><div class="wm-skill-list">${topSkills.map(x=>`<button class="wm-skill-btn" data-wish-skill="${x.k}">${escapeHtml(skillLabels[x.k])}</button>`).join('')}</div><div class="wm-detail" id="wishSkillDetail">Choose a skill above.</div>
      ${overlap?`<div class="wm-overlap"><strong>${overlap.count>=3?`${overlap.count} Wishes are quite similar.`:'Some Wishes lean toward the same kind of play.'}</strong><div class="subtle" style="color:var(--ink);margin-top:3px">${escapeHtml(overlap.label)} appears repeatedly. That is not bad, but one different choice could broaden the cognitive variety.</div>${alt?`<div class="wm-alt"><img src="${alt.image}" alt="${escapeHtml(alt.name)}"><div class="wm-alt-main"><div class="wm-alt-name">Try something different: ${escapeHtml(alt.name)}</div><div class="wm-alt-copy">A stronger contrast with the current Wishes.</div></div><button class="bundle-swap" id="viewWishAlternative" data-alt-product="${alt.id}">See it</button></div>`:''}</div>`:''}`;
    bindWishesMap();
  }

  function bindWishesMap(){
    const content=document.getElementById('wishesMapContent'); if(!content)return;
    content.querySelectorAll('[data-wish-skill]').forEach(btn=>btn.addEventListener('click',()=>{
      content.querySelectorAll('[data-wish-skill]').forEach(x=>x.classList.toggle('active',x===btn));
      const k=btn.dataset.wishSkill;
      const contributing=state.wishes.map(id=>products.find(p=>p.id===id)).filter(p=>p?.skills?.[k]).sort((a,b)=>(b.skills[k]||0)-(a.skills[k]||0));
      const detail=content.querySelector('#wishSkillDetail');
      detail.innerHTML=contributing.length?`<strong>${escapeHtml(skillLabels[k])}</strong><br>${contributing.map(p=>escapeHtml(p.name)).join(' · ')}`:'No saved Wish contributes strongly to this area yet.';
    }));
    content.querySelector('#viewWishAlternative')?.addEventListener('click',e=>{
      state.currentProductId=e.currentTarget.dataset.altProduct;state.activeScreen='discover';save();wishesMapDialog.close();renderAll();showToast('Showing a more complementary option.');
    });
  }

  function renderProfilePanel(){
    const name=state.profile.name||'Child';
    return `<div class="eyebrow">Child profile</div><h2>${escapeHtml(name)}</h2><label for="profileName">Name</label><input id="profileName" type="text" value="${escapeHtml(name)}"><div style="height:12px"></div><label for="profileAge">Age</label><select id="profileAge">${[4,5,6,7,8].map(a=>`<option value="${a}" ${Number(state.profile.age)===a?'selected':''}>${a} years</option>`).join('')}</select><div style="height:14px"></div><h3>Interests</h3><div class="chip-grid">${interests.map(x=>`<button class="chip small ${state.profile.interests.includes(x)?'selected':''}" data-profile-interest="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('')}</div><div style="height:14px"></div><h3>Regular activities</h3><div class="chip-grid">${activities.map(x=>`<button class="chip small ${state.profile.activities.includes(x)?'selected':''}" data-profile-activity="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('')}</div><div style="height:8px"></div>${(state.customActivities||[]).length?`<p class="subtle">Also added: ${(state.customActivities||[]).map(a=>escapeHtml(a.name)).join(' · ')}</p>`:''}<div style="height:16px"></div><button class="btn btn-primary" id="saveProfile" style="width:100%">Save profile</button><div style="height:8px"></div><button class="btn btn-ghost" id="resetDemo" style="width:100%">Reset MVP</button>`;
  }

  function renderAll(){
    renderOnboarding();
    if(!state.completed) return;
    renderHeader(); renderDiscover(); renderPlayroom(); renderWishes();
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(`${state.activeScreen}Screen`)?.classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===state.activeScreen));
    bindDynamic();
  }

  function bindDynamic(){
    document.querySelectorAll('.skill-info').forEach(btn=>btn.addEventListener('click',e=>{ e.stopPropagation(); const k=btn.dataset.skill; document.getElementById('skillTitle').textContent=skillInfo[k]?.[0]||'Skill'; document.getElementById('skillText').textContent=skillInfo[k]?.[1]||''; skillDialog.showModal(); }));

    document.getElementById('skipProduct')?.addEventListener('click',()=>{ const p=currentProduct(); if(!p)return; state.seenSwipeHint=true; state.skipped.push(p.id); state.currentProductId=null; save(); showToast('Skipped. We’ll learn from that.'); nextProduct(); });
    document.getElementById('saveProduct')?.addEventListener('click',()=>{ const p=currentProduct(); if(!p)return; state.seenSwipeHint=true; if(!state.wishes.includes(p.id)) state.wishes.push(p.id); state.currentProductId=null; save(); showToast('Saved to Wishes'); nextProduct(); });
    document.getElementById('ownProduct')?.addEventListener('click',()=>{ const p=currentProduct(); if(!p)return; state.seenSwipeHint=true; if(!state.playroom.includes(p.id)) state.playroom.push(p.id); state.currentProductId=null; save(); showToast(`Added ${p.name} to the Playroom`); nextProduct(); });
    document.getElementById('resetSkipped')?.addEventListener('click',()=>{ state.skipped=[];state.currentProductId=null;save();renderAll(); });
    document.getElementById('openAddDialog')?.addEventListener('click',()=>{ addFlow={type:null,category:null}; renderAddDialog(); addDialog.showModal(); bindAddDialog(); });
    document.getElementById('openBundleDialog')?.addEventListener('click',()=>{ state.bundle=[]; renderBundlePanel(); bundleDialog.showModal(); bindBundleDialog(); });
    document.querySelectorAll('[data-remove-owned]').forEach(btn=>btn.addEventListener('click',()=>{ state.playroom=state.playroom.filter(x=>x!==btn.dataset.removeOwned); save(); renderAll(); showToast('Removed from Playroom'); }));
    document.querySelectorAll('[data-remove-activity]').forEach(btn=>btn.addEventListener('click',()=>{ const id=btn.dataset.removeActivity; state.profile.activities=state.profile.activities.filter(x=>x!==id); state.customActivities=(state.customActivities||[]).filter(x=>x.id!==id); save(); renderAll(); showToast('Activity removed'); }));

    document.querySelectorAll('[data-remove-wish]').forEach(btn=>btn.addEventListener('click',()=>{ state.wishes=state.wishes.filter(x=>x!==btn.dataset.removeWish); state.reserved=state.reserved.filter(x=>x!==btn.dataset.removeWish); save(); renderAll(); }));
    document.getElementById('shareWishes')?.addEventListener('click',()=>{ renderShareWishDialog('__all__'); shareWishDialog.showModal(); });
    document.getElementById('openWishesMap')?.addEventListener('click',()=>{ renderWishesMap(); wishesMapDialog.showModal(); });
    document.querySelectorAll('[data-share-single]').forEach(btn=>btn.addEventListener('click',()=>{ renderShareWishDialog(btn.dataset.shareSingle); shareWishDialog.showModal(); }));
    document.querySelectorAll('[data-go]').forEach(btn=>btn.addEventListener('click',()=>{ state.activeScreen=btn.dataset.go;save();renderAll(); }));
  }

  function bindAddDialog(){
    const content=document.getElementById('addDialogContent'); if(!content)return;
    content.querySelectorAll('[data-add-type]').forEach(btn=>btn.addEventListener('click',()=>{addFlow={type:btn.dataset.addType,category:null};renderAddDialog();bindAddDialog();}));
    content.querySelectorAll('[data-add-back]').forEach(btn=>btn.addEventListener('click',()=>{ if(btn.dataset.addBack==='root')addFlow={type:null,category:null}; else addFlow.category=null; renderAddDialog();bindAddDialog(); }));
    content.querySelectorAll('[data-add-category]').forEach(btn=>btn.addEventListener('click',()=>{addFlow.category=btn.dataset.addCategory;renderAddDialog();bindAddDialog();}));
    content.querySelectorAll('[data-add-item]').forEach(btn=>btn.addEventListener('click',()=>{ if(!state.playroom.includes(btn.dataset.addItem))state.playroom.push(btn.dataset.addItem);save();renderAll();renderAddDialog();bindAddDialog();showToast('Added to Playroom'); }));
    content.querySelectorAll('[data-add-activity]').forEach(btn=>btn.addEventListener('click',()=>{ if(!state.profile.activities.includes(btn.dataset.addActivity))state.profile.activities.push(btn.dataset.addActivity);save();renderAll();renderAddDialog();bindAddDialog();showToast('Activity added'); }));
    content.querySelector('#addCustomItem')?.addEventListener('click',()=>{ const input=content.querySelector('#customItemInput'); const name=input?.value.trim(); if(!name){showToast('Write a toy or game name first.');return;} const cfg=categoryConfig[addFlow.category]||categoryConfig.games; const id='custom-item-'+Date.now(); state.customItems.push({id,name,emoji:cfg.emoji,group:'custom-'+addFlow.category,skills:cfg.skills});state.playroom.push(id);save();addDialog.close();renderAll();showToast(`${name} added to the Playroom`); });
    content.querySelector('#addCustomActivity')?.addEventListener('click',()=>{ const input=content.querySelector('#customActivityInput'); const name=input?.value.trim(); if(!name){showToast('Write an activity first.');return;} const id='custom-activity-'+Date.now(); state.customActivities.push({id,name,skills:inferCustomActivitySkills(name)});save();addDialog.close();renderAll();showToast(`${name} added`); });
  }

  function bindBundleDialog(){
    const panel=document.getElementById('bundleContent'); if(!panel)return;
    panel.querySelector('#bundleBudget')?.addEventListener('change',e=>{ state.bundleBudget=Number(e.target.value); state.bundle=[]; generateBundle(); renderBundlePanel(); bindBundleDialog(); });
    panel.querySelectorAll('[data-swap-bundle]').forEach(btn=>btn.addEventListener('click',()=>{swapBundleItem(btn.dataset.swapBundle);renderBundlePanel();bindBundleDialog();}));
    panel.querySelector('#saveBundleWishes')?.addEventListener('click',()=>{ state.bundle.forEach(id=>{if(!state.wishes.includes(id))state.wishes.push(id)}); save(); bundleDialog.close(); renderAll(); showToast('Bundle saved to Wishes'); });
  }

  function swapBundleItem(id){
    const current=products.find(p=>p.id===id); if(!current)return;
    const taken=new Set([...state.playroom,...state.bundle,...state.wishes]); taken.delete(id);
    const options=products.filter(p=>!taken.has(p.id)&&Number(state.profile.age)>=p.age[0]&&Number(state.profile.age)<=p.age[1]&&p.group!==current.group).sort((a,b)=>scoreProduct(b)-scoreProduct(a));
    if(!options.length){ showToast('No good swap found right now.'); return; }
    state.bundle=state.bundle.map(x=>x===id?options[0].id:x); save(); showToast('Swapped for a different kind of play');
  }

  function toggleArray(arr,val){ const i=arr.indexOf(val); if(i>=0)arr.splice(i,1); else arr.push(val); }

  app.addEventListener('click',e=>{
    const btn=e.target.closest('button'); if(!btn)return;
    if(btn.id==='startOnboarding'){state.onboardingStep=0;save();renderAll();}
    if(btn.id==='nextOnboarding'){
      if(state.onboardingStep===0){ const n=document.getElementById('childName')?.value.trim(); const a=Number(document.getElementById('childAge')?.value); if(!n){showToast('Add a name or nickname first.');return;} state.profile.name=n;state.profile.age=a; }
      state.onboardingStep=Math.min(3,state.onboardingStep+1); save(); renderAll();
    }
    if(btn.id==='backOnboarding'){state.onboardingStep=Math.max(-1,state.onboardingStep-1);save();renderAll();}
    if(btn.dataset.interest!==undefined){toggleArray(state.profile.interests,btn.dataset.interest);save();renderAll();}
    if(btn.dataset.playroomSelect!==undefined){toggleArray(state.playroom,btn.dataset.playroomSelect);save();renderAll();}
    if(btn.dataset.activity!==undefined){toggleArray(state.profile.activities,btn.dataset.activity);save();renderAll();}
    if(btn.id==='finishOnboarding'){state.completed=true;state.activeScreen='discover';state.currentProductId=null;save();renderAll();showToast('Your first matches are ready.');}
  });

  document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{ state.activeScreen=btn.dataset.screen; save(); renderAll(); }));
  document.querySelectorAll('[data-close-dialog]').forEach(btn=>btn.addEventListener('click',()=>document.getElementById(btn.dataset.closeDialog)?.close()));

  document.getElementById('profileBtn').addEventListener('click',()=>{
    const existing=document.getElementById('profileInline');
    if(existing){existing.remove();return;}
    const panel=document.createElement('div'); panel.id='profileInline'; panel.className='card profile-panel show'; panel.style.margin='14px 18px 0'; panel.innerHTML=renderProfilePanel(); document.querySelector('.topbar').insertAdjacentElement('afterend',panel);
    panel.querySelectorAll('[data-profile-interest]').forEach(btn=>btn.addEventListener('click',()=>{toggleArray(state.profile.interests,btn.dataset.profileInterest);btn.classList.toggle('selected');}));
    panel.querySelectorAll('[data-profile-activity]').forEach(btn=>btn.addEventListener('click',()=>{toggleArray(state.profile.activities,btn.dataset.profileActivity);btn.classList.toggle('selected');}));
    panel.querySelector('#saveProfile').addEventListener('click',()=>{state.profile.name=panel.querySelector('#profileName').value.trim()||state.profile.name;state.profile.age=Number(panel.querySelector('#profileAge').value)||state.profile.age;state.currentProductId=null;save();panel.remove();renderAll();showToast('Profile updated');});
    panel.querySelector('#resetDemo').addEventListener('click',()=>{ if(confirm('Reset the SmartRoom MVP and start onboarding again?')){localStorage.removeItem('smartroom_mvp_v4');state=structuredClone(defaults);renderAll();} });
  });

  giftDialog.addEventListener('click',e=>{
    const reserve=e.target.closest('[data-reserve-gift]');
    if(reserve){ if(!state.reserved.includes(reserve.dataset.reserveGift))state.reserved.push(reserve.dataset.reserveGift);save();renderGiftView();renderWishes();bindDynamic();showToast('Gift reserved — duplicates avoided.'); }
  });

  // Swipe support with visible drag feedback and button fallback.
  let swipeStart=null;
  app.addEventListener('pointerdown',e=>{
    const card=e.target.closest('#productCard'); if(!card||e.target.closest('button,a'))return;
    state.seenSwipeHint=true; save(); card.classList.remove('swipe-hint-active');
    swipeStart={x:e.clientX,y:e.clientY,card,pointerId:e.pointerId};
    try{card.setPointerCapture(e.pointerId)}catch(err){}
  });
  app.addEventListener('pointermove',e=>{
    if(!swipeStart||e.pointerId!==swipeStart.pointerId)return;
    const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;
    if(Math.abs(dy)>Math.abs(dx)*1.4)return;
    const rot=Math.max(-7,Math.min(7,dx/18));
    swipeStart.card.style.transform=`translateX(${dx}px) rotate(${rot}deg)`;
    swipeStart.card.style.opacity=String(Math.max(.55,1-Math.abs(dx)/420));
    const like=document.getElementById('likeStamp'),nope=document.getElementById('nopeStamp');
    if(like)like.style.opacity=dx>25?String(Math.min(1,(dx-25)/70)):0;
    if(nope)nope.style.opacity=dx<-25?String(Math.min(1,(-dx-25)/70)):0;
  });
  function endSwipe(e){
    if(!swipeStart)return;
    const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y; const card=swipeStart.card; swipeStart=null;
    if(Math.abs(dx)>=82&&Math.abs(dx)>Math.abs(dy)){
      card.style.transform=`translateX(${dx>0?150:-150}px) rotate(${dx>0?7:-7}deg)`;card.style.opacity='.18';
      setTimeout(()=>{ if(dx>0)document.getElementById('saveProduct')?.click(); else document.getElementById('skipProduct')?.click(); },120);
    }else{
      card.style.transform='';card.style.opacity='';
      const like=document.getElementById('likeStamp'),nope=document.getElementById('nopeStamp');if(like)like.style.opacity=0;if(nope)nope.style.opacity=0;
    }
  }
  app.addEventListener('pointerup',endSwipe);
  app.addEventListener('pointercancel',e=>{ if(swipeStart){swipeStart.card.style.transform='';swipeStart.card.style.opacity='';swipeStart=null;} });

  renderAll();
})();
</script>
</body>
</html>
