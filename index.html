{id:'cup-slalom',name:'Cup Slalom',emoji:'🚲',ageMin:5,ageMax:8,min:10,max:20,duration:15,locations:['outside'],materials:['Plastic cups','Bike or scooter'],skills:{spatial:35,problem:25,attention:20,movement:20},summary:'Ride a simple zig-zag course around plastic cups.',steps:['Place several plastic cups in a line with generous gaps.','Ask your child to ride around them in a zig-zag.','Repeat the route in the opposite direction.','Let your child rearrange the course for you.'],easier:'Move the cups farther apart.',harder:'Bring the cups closer or ask your child to remember a route.',variation:'Give different cup colours different movement rules.',safety:'Use a flat, traffic-free area and a helmet.',tags:['active','low-prep']},

{id:'red-light',name:'Red Light, Wiggle Light',emoji:'🚦',ageMin:4,ageMax:7,min:5,max:10,duration:5,locations:['home','outside'],materials:['None'],skills:{selfcontrol:40,attention:30,movement:30},summary:'Move, freeze, and switch rules on cue.',steps:['Green means move and red means freeze.','Play several quick rounds.','Add yellow for slow motion.','Later swap the rules.'],easier:'Use only move and freeze.',harder:'Reverse the rules or add a fourth cue.',variation:'Move like robots or penguins.',safety:'Use a clear area away from sharp furniture or traffic.',tags:['active','no-materials']},

{id:'mystery-bag',name:'Mystery Bag',emoji:'🎒',ageMin:4,ageMax:8,min:10,max:20,duration:10,locations:['home'],materials:['Bag','4–6 safe household objects'],skills:{language:30,attention:25,memory:20,creativity:15,selfcontrol:10},summary:'Guess hidden objects using touch and clues.',steps:['Place several safe objects in a bag.','Without looking, your child feels one object.','Ask them to describe what they notice.','Guess, reveal, and swap roles.'],easier:'Use very different objects.',harder:'Describe without saying the object category.',variation:'Invent a story about each mystery object.',safety:'Use blunt, clean, child-safe objects.',tags:['calm','sensory']},
{id:'cushion-fort',name:'Cushion Fort',emoji:'🏕️',ageMin:4,ageMax:8,min:15,max:30,duration:20,locations:['home'],materials:['Cushions','Blanket','Chairs'],skills:{creativity:30,problem:25,spatial:25,movement:10,selfcontrol:10},summary:'Plan and build a small fort together.',steps:['Choose a safe area.','Ask what the fort needs before building.','Build using cushions, blankets, and sturdy furniture.','Test it and improve anything that falls.'],easier:'Build a tiny reading den.',harder:'Set a rule such as using only one blanket.',variation:'Turn it into a shop, spaceship, or animal hospital.',safety:'Avoid unstable furniture and never cover heat sources.',tags:['creative','home']},

const DEFAULT={profile:{name:'',age:5,goal:120},sessions:[],library:['cards','lego','puzzle','drawing','movement'],screen:'home',mixPeriod:'week',play:{duration:10,location:'home',players:'two',mode:'balance',skills:[]},log:null,discover:{likes:[],skills:[]}};
let state=load();
let planChooserOpen=false;
function load(){try{let x=JSON.parse(localStorage.getItem('playpocket:v3'));x.library=(x.library||DEFAULT.library).map(id=>id==='uno'?'cards':id);return {...structuredClone(DEFAULT),...x,profile:{...DEFAULT.profile,...(x.profile||{})},play:{...DEFAULT.play,...(x.play||{})},discover:{...DEFAULT.discover,...(x.discover||{})}}}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem('playpocket:v3',JSON.stringify(state))}
function periodStart(period='week'){const d=new Date();d.setHours(0,0,0,0);if(period==='week'){const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day)}else if(period==='month'){d.setDate(1)}else if(period==='year'){d.setMonth(0,1)}return d}
function sessionsFor(period='week'){const start=periodStart(period);return state.sessions.filter(s=>{const d=new Date(s.date||0);return !Number.isNaN(d.getTime())&&d>=start})}
function togetherMinutes(period='week'){return sessionsFor(period).reduce((a,s)=>a+(s.together||0),0)}
function weekSessions(){return sessionsFor('week').length}
function allTimeTogether(){return state.sessions.reduce((a,s)=>a+(s.together||0),0)}
function allTimeSessions(){return state.sessions.length}
function mixRaw(period='week'){let r={};Object.keys(SKILLS).forEach(k=>r[k]=0);sessionsFor(period).forEach(s=>{Object.entries(s.skills||{}).forEach(([k,w])=>{if(r[k]!==undefined)r[k]+=(s.together||0)*(w/100)})});return r}
function mixPct(period='week'){const r=mixRaw(period),sum=Object.values(r).reduce((a,b)=>a+b,0);let p={};Object.keys(SKILLS).forEach(k=>p[k]=sum?Math.round(r[k]/sum*100):0);return p}
function leastSkills(period='week'){const r=mixRaw(period);return Object.keys(SKILLS).sort((a,b)=>r[a]-r[b])}

function warmHomeInsight(){
  const t=togetherMinutes('week');
  const goal=Math.max(1,state.profile.goal||120);
  const pct=Math.round((t/goal)*100);
  const raw=mixRaw('week');
  const active=Object.values(raw).filter(v=>v>=2).length;
  const sessions=weekSessions();

  if(t===0) return "A little play goes a long way. You’ve got this.";
  if(pct>=100 && active>=5) return "You did it — time together and a lovely mix of play this week ❤️";
  if(pct>=100) return "You reached your weekly goal. That’s real time you made for each other ❤️";
  if(active>=6 && pct>=60) return "Such a nice mix this week — lots of different ways to think and play.";
  if(pct>=80) return "You’re almost there — one more little play session could do it.";
  if(pct>=50 && active>=4) return "You’re making lovely time together this week — and keeping it nicely varied.";
  if(pct>=50) return "You’ve got a good rhythm going. Keep enjoying the little moments together.";
  if(sessions>=2) return "Nice start this week — you’re building a lovely little rhythm together.";
  return "Lovely start. A few more playful moments and your week will begin to take shape.";
}

function skillChips(skills,limit=3){return Object.entries(skills).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>`<span class="chip">${SKILLS[k]?.emoji||''} ${SKILLS[k]?.label||k}</span>`).join('')}
function nav(active){return `<nav class="nav">${[['home','🏠','Home'],['play','🎲','Find'],['log','➕','Log'],['milestones','🏆','Milestones'],['discover','🎁','Gifts']].map(([id,ic,lab])=>`<button class="${active===id?'active':''}" onclick="go('${id}')"><b>${ic}</b>${lab}</button>`).join('')}</nav>`}
function header(){return `<header class="top"><div class="logo">✦</div><div class="brandcopy"><b>SmartParent</b><span>Your kid has fun while you take care of his cognitive development</span></div><button class="avatar" onclick="go('profile')"><i>👤</i>${state.profile.name||'Profile'}</button></header>`}
function go(s){state.screen=s;save();render();window.scrollTo(0,0)}
function setMixPeriod(p){state.mixPeriod=p;save();render()}
function home(){const t=togetherMinutes('week'),goal=state.profile.goal,pct=Math.min(100,Math.round(t/goal*100)),period=state.mixPeriod||'week',mix=mixPct(period),emptyWeek=sessionsFor('week').length===0,emptyPeriod=sessionsFor(period).length===0;const next=nextMilestone();const rec=recommend()[0]||GAMES[0];return `${header()}<main class="page">
<section class="card hero"><span class="eyebrow">This week</span><div class="big">${t} <small>/ ${goal} min together</small></div><div class="goal-label">Your weekly play goal</div><div class="progress"><span style="width:${pct}%"></span></div><div class="mini-stats"><span><b>${weekSessions()}</b> shared play ${weekSessions()===1?'session':'sessions'}</span><span>${pct}% of weekly goal</span></div>${emptyWeek?`<p class="muted" style="font-size:12px;margin-bottom:15px">Let’s start</p>`:''}<div class="home-actions"><button class="btn primary" onclick="startLog()">＋ Log a game</button><button class="btn secondary" onclick="go('play')">🎲 Find a game</button></div></section>
<section class="section card mix"><div class="section-head"><div><span class="eyebrow">Make the time count</span><h2>Cognitive Mix</h2></div><button class="link" onclick="go('weekly')">See plan →</button></div><div class="period-tabs">${[['week','Week'],['month','Month'],['year','Year']].map(([p,l])=>`<button class="${period===p?'sel':''}" onclick="setMixPeriod('${p}')">${l}</button>`).join('')}</div>${mixRows(mix,false)}${period==='week'?`<div class="insight">${warmHomeInsight()}</div>`:''}</section>
<section class="section card recommend"><span class="eyebrow">${emptyWeek?'Let us suggest a fun activity to start with':'A good fit next'}</span><h2>${rec.emoji} ${rec.name}</h2><p class="muted">${rec.summary}</p><div class="chips">${skillChips(rec.skills)}</div><div class="why">${emptyWeek?'A simple, fun activity to get your week started.':whyGame(rec)}</div><button class="btn primary full" onclick="openGame('${rec.id}')">See game</button></section>
<section class="section card milestone-preview" onclick="go('milestones')"><div class="badge">❤️</div><div><span class="eyebrow">Parent milestone</span><h3>${next.title}</h3><p class="muted">${next.subtitle}</p></div><div>→</div></section>
</main>${nav('home')}`}
function mixRows(mix,example){let data=example?{memory:24,attention:31,problem:19,language:12,creativity:7,spatial:7}:mix;return Object.entries(data).filter(([k])=>SKILLS[k]).map(([k,v])=>`<div class="mix-row"><div class="mix-icon" style="background:${SKILLS[k].color}33">${SKILLS[k].emoji}</div><div><div class="mix-label">${SKILLS[k].label}</div><div class="mix-track"><span style="width:${v}%;background:${SKILLS[k].color}"></span></div></div><div class="pct">${v}%</div></div>`).join('')+(example?`<div class="muted" style="font-size:10px;margin-top:12px">Example only — your real mix replaces this after your first log.</div>`:'')}
const GAME_PLAYERS={

function supportsPlayers(g){return (GAME_PLAYERS[g.id]||['two']).includes(state.play.players||'two')}
function playerLabel(v){return v==='solo'?'Kid solo':v==='group'?'Group':'2 players'}
function scoreGame(g){if(state.profile.age<g.ageMin||state.profile.age>g.ageMax)return -999;if(!g.locations.includes(state.play.location)&&state.play.location!=='anywhere')return -200;if(!supportsPlayers(g))return -150;if(state.play.duration<g.min||state.play.duration>g.max)return -100;let score=20;if(state.play.mode==='skills'&&state.play.skills.length){score+=state.play.skills.reduce((a,k)=>a+(g.skills[k]||0),0)}else{leastSkills().slice(0,3).forEach((k,i)=>score+=(g.skills[k]||0)*(3-i));}return score}
function recommend(){return [...GAMES].sort((a,b)=>scoreGame(b)-scoreGame(a)).filter(g=>scoreGame(g)>-100).slice(0,3)}
function whyGame(g){if(state.play.mode==='skills'&&state.play.skills.length){return `Strong match for ${state.play.skills.map(k=>SKILLS[k].label.toLowerCase()).join(', ')}.`}const k=leastSkills()[0];return `${SKILLS[k].label} has had less play this week, so this adds more of it.`}
function play(){const recs=recommend();return `${header()}<main class="page"><div class="screen-head"><span class="eyebrow">Find a game</span><h1>What works right now?</h1><p class="muted">A few quick choices, then we’ll suggest three good fits.</p></div><section class="card panel"><div class="filter-label">How much time?</div><div class="filter-row">${[5,10,15,30].map(n=>`<button class="${state.play.duration===n?'sel':''}" onclick="setPlay('duration',${n})">${n} min</button>`).join('')}</div><div class="filter-label">Where?</div><div class="filter-row">${[['home','Home'],['outside','Outside'],['car','Car'],['waiting','Waiting'],['anywhere','Anywhere']].map(([v,l])=>`<button class="${state.play.location===v?'sel':''}" onclick="setPlay('location','${v}')">${l}</button>`).join('')}</div><div class="filter-label">Play with</div><div class="filter-row">${[['solo','Kid solo'],['two','2 players'],['group','Group']].map(([v,l])=>`<button class="${(state.play.players||'two')===v?'sel':''}" onclick="setPlay('players','${v}')">${l}</button>`).join('')}</div><div class="filter-label">Balance my week</div><button class="balance ${state.play.mode==='balance'?'sel':''}" onclick="balanceMode()"><span><b>✨ Let SmartParent choose</b><small>Based on cognitive skills that have had less play this week.</small></span><span>→</span></button><div class="filter-label">Cognitive skills <span style="font-size:10px;color:var(--muted);font-weight:650">Choose up to 3</span></div><div class="skill-grid">${Object.entries(SKILLS).map(([k,s])=>`<button class="skill ${state.play.skills.includes(k)?'sel':''}" onclick="toggleSkill('${k}')"><span class="em">${s.emoji}</span><span>${s.label}</span></button>`).join('')}</div><div class="counter">${state.play.skills.length}/3 selected</div><button class="btn primary full" style="margin-top:16px" onclick="renderRecommendations()">Show me ideas</button></section><div id="recs">${recCards(recs)}</div></main>${nav('play')}`}
function setPlay(k,v){state.play[k]=v;save();render()}
function balanceMode(){state.play.mode='balance';state.play.skills=[];save();render()}
function toggleSkill(k){let a=state.play.skills;if(a.includes(k))a=a.filter(x=>x!==k);else{if(a.length>=3)return;a=[...a,k]}state.play.skills=a;state.play.mode=a.length?'skills':'balance';save();render()}
function renderRecommendations(){render();setTimeout(()=>document.getElementById('recs')?.scrollIntoView({behavior:'smooth'}),20)}
function recCards(recs){return `<div class="section-head" style="margin-top:17px"><div><span class="eyebrow">Suggestions</span><h2>Three good fits</h2></div></div><div class="rec-list">${recs.map((g,i)=>`<section class="card game-card"><div class="game-top"><div class="game-emoji">${g.emoji}</div><div class="rank">${i===0?'Best fit':i===1?'Another option':'Something different'}</div></div><h2>${g.name}</h2><p class="muted">${g.duration} min · ${g.locations[0][0].toUpperCase()+g.locations[0].slice(1)} · ${playerLabel(state.play.players||'two')} · ${g.materials.join(', ')}</p><div class="chips">${skillChips(g.skills)}</div><div class="why">${whyGame(g)}</div><button class="btn primary full" onclick="openGame('${g.id}')">See game</button></section>`).join('')}</div>`}
function openGame(id){state.currentGame=id;state.screen='game';save();render();window.scrollTo(0,0)}
function gameDetail(){const g=GAMES.find(x=>x.id===state.currentGame)||GAMES[0];return `${header()}<main class="page"><button class="link" onclick="go('play')">← Back</button><section class="card activity-detail"><div class="game-emoji">${g.emoji}</div><h1>${g.name}</h1><p class="muted">${g.summary}</p><div class="chips"><span class="chip">⏱ ${g.duration} min</span><span class="chip">📍 ${g.locations.join(' / ')}</span></div><div class="filter-label">What you need</div><p class="muted" style="font-size:13px">${g.materials.join(' · ')}</p><div class="filter-label">How to play</div><ol class="steps">${g.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="filter-label">Cognitive skills</div>${mixRows(g.skills,false)}<div class="note"><b>Easier:</b> ${g.easier}</div><div class="note"><b>Harder:</b> ${g.harder}</div><div class="note"><b>Fun variation:</b> ${g.variation}</div>${g.safety?`<div class="note warn"><b>Safety:</b> ${g.safety}</div>`:''}<button class="btn primary full" style="margin-top:16px" onclick="logFromGame('${g.id}')">We played this — log it</button></section></main>${nav('play')}`}
function startLog(){state.log={stage:'choose'};state.screen='log';save();render()}
function log(){if(!state.log)state.log={stage:'choose'};if(state.log.stage==='session')return logSession();if(state.log.stage==='analyse')return logAnalyse();if(state.log.stage==='confirm')return logConfirm();return logChoose()}
function recentActivities(){let arr=[];state.sessions.slice(-3).reverse().forEach(s=>arr.push({name:s.name,emoji:s.emoji,skills:s.skills,source:s.source,id:s.refId}));Object.entries(PRESETS).forEach(([id,p])=>{if(!arr.some(x=>x.name===p.name))arr.push({...p,source:'preset',id})});return arr.slice(0,6)}
function logChoose(){return `${header()}<main class="page"><div class="screen-head"><span class="eyebrow">Log a game</span><h1>What did you play?</h1><p class="muted">Add something you already played together.</p></div><section class="card panel"><div class="filter-label">Recent & familiar</div><div class="log-list">${recentActivities().map(a=>`<button class="log-item" onclick="chooseKnown('${a.source}','${a.id||''}','${esc(a.name)}')"><i>${a.emoji}</i><span><b>${a.name}</b><small>${topSkillNames(a.skills)}</small></span><span>→</span></button>`).join('')}</div><div class="filter-label">Describe another activity</div><textarea id="customText" class="input" placeholder="We built a tower with plastic cups..."></textarea><button class="btn secondary full" style="margin-top:9px" onclick="analyseCustom()">Analyse activity</button><div class="future"><b>📷 Photo recognition — later</b><br>Future version: photograph a toy, game, or setup and let an LLM-powered image wrapper suggest what it is and the likely Play Mix.</div></section></main>${nav('log')}`}
function esc(s){return String(s||'').replaceAll("'","&#39;")}
function topSkillNames(sk){return Object.entries(sk||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>SKILLS[k]?.label||k).join(' · ')}
function chooseKnown(source,id,name){let a;if(source==='game')a=GAMES.find(g=>g.id===id);else if(source==='preset')a=PRESETS[id];else{let s=[...state.sessions].reverse().find(x=>x.name===name);a=s?{name:s.name,emoji:s.emoji,skills:s.skills}:null}if(!a)return;state.log={stage:'session',name:a.name||a.title,emoji:a.emoji||'🎲',skills:a.skills,source,refId:id,duration:a.duration||15,together:a.duration||15,custom:false};save();render()}
function logFromGame(id){const g=GAMES.find(x=>x.id===id);state.log={stage:'session',name:g.name,emoji:g.emoji,skills:g.skills,source:'game',refId:id,duration:g.duration,together:g.duration,custom:false};state.screen='log';save();render()}
function analyseCustom(){const text=(document.getElementById('customText')?.value||'').trim();if(!text)return;state.log={stage:'analyse',description:text,...inferActivity(text)};save();render()}
function inferActivity(text){let t=text.toLowerCase(),skills={};function add(k,v){skills[k]=(skills[k]||0)+v}if(/lego|block|tower|build|fort|construct/.test(t)){add('spatial',30);add('problem',30);add('creativity',25);add('attention',15)}else if(/draw|paint|craft|colour|color/.test(t)){add('creativity',40);add('attention',20);add('spatial',20);add('language',20)}else if(/story|read|book|pretend/.test(t)){add('language',40);add('creativity',30);add('memory',15);add('attention',15)}else if(/ball|bike|scooter|run|jump|dance/.test(t)){add('movement',40);add('attention',20);add('spatial',25);add('selfcontrol',15)}else{add('attention',30);add('problem',25);add('creativity',25);add('language',20)}let name=text.length>32?text.slice(0,29)+'…':text;return {name,emoji:'✨',skills,custom:true}}
function logAnalyse(){const l=state.log;return `${header()}<main class="page"><button class="link" onclick="startLog()">← Back</button><section class="card activity-detail"><span class="eyebrow">Estimated from your description</span><h1>${l.emoji} ${l.name}</h1><p class="muted">“${l.description}”</p><div class="filter-label">Estimated Play Mix</div>${mixRows(l.skills,false)}<div class="note">These percentages describe the activity, not your child.</div><div class="two" style="margin-top:14px"><button class="btn ghost" onclick="startLog()">Adjust</button><button class="btn primary" onclick="acceptAnalysis()">Looks right</button></div></section></main>${nav('log')}`}
function acceptAnalysis(){state.log.stage='session';state.log.duration=15;state.log.together=15;state.log.source='custom';save();render()}
function logSession(){const l=state.log;return `${header()}<main class="page"><button class="link" onclick="startLog()">← Back</button><div class="screen-head"><span class="eyebrow">Log a game</span><h1>${l.emoji} ${l.name}</h1><p class="muted">A quick check-in, then your Home screen updates.</p></div><section class="card session"><div class="filter-label">Cognitive skills</div><div class="chips">${skillChips(l.skills,4)}</div><div class="filter-label">How long did you play?</div><div class="duration-grid">${[5,10,15,20,30].map(n=>`<button class="${l.duration===n?'sel':''}" onclick="setDuration(${n})">${n} min</button>`).join('')}<button onclick="customDuration()">Custom</button></div><div class="filter-label">Time together</div><div class="together"><div class="muted" style="font-size:11px">How much of that time were you actively playing together?</div><div class="stepper"><button onclick="stepTogether(-5)">−</button><strong>${l.together} min</strong><button onclick="stepTogether(5)">+</button></div><div class="shortcuts"><button onclick="setTogether('all')">All</button><button onclick="setTogether('half')">Half</button><button onclick="setTogether('none')">None</button></div></div><button class="btn primary full" style="margin-top:16px" onclick="saveSession()">Save play</button></section></main>${nav('log')}`}
function setDuration(n){state.log.duration=n;state.log.together=Math.min(state.log.together,n);if(state.log.together===0)state.log.together=n;save();render()}
function customDuration(){let n=parseInt(prompt('Minutes played?','20'),10);if(!n||n<1)return;state.log.duration=n;state.log.together=Math.min(state.log.together||n,n);save();render()}
function stepTogether(d){state.log.together=Math.max(0,Math.min(state.log.duration,state.log.together+d));save();render()}
function setTogether(x){state.log.together=x==='all'?state.log.duration:x==='half'?Math.round(state.log.duration/2):0;save();render()}
function saveSession(){const l=state.log;state.sessions.push({id:Date.now(),name:l.name,emoji:l.emoji,skills:l.skills,total:l.duration,together:l.together,source:l.source,refId:l.refId||'',date:new Date().toISOString()});state.log={...l,stage:'confirm',milestone:nextMilestone(true)};save();render()}
function logConfirm(){const l=state.log;return `${header()}<main class="page"><section class="card confirm"><div class="confirm-icon">❤️</div><span class="eyebrow">Play logged</span><h1>${l.together} minutes together added</h1><p class="muted">Your weekly time and Cognitive Mix have been updated.</p>${l.milestone?.justUnlocked?`<div class="note" style="margin:16px 0"><b>🎉 ${l.milestone.title}</b><br>${l.milestone.subtitle}</div>`:''}${l.custom?`<button class="btn secondary full" style="margin-bottom:9px" onclick="saveCustomLibrary()">Save ${l.name} to Library</button>`:''}<button class="btn primary full" onclick="finishLog()">Back home</button><button class="btn ghost full" style="margin-top:9px" onclick="startLog()">Log another</button></section></main>${nav('log')}`}
function finishLog(){state.log=null;state.screen='home';save();render();window.scrollTo(0,0)}
function saveCustomLibrary(){const key='custom:'+Date.now();PRESETS[key]={name:state.log.name,emoji:state.log.emoji,skills:state.log.skills};state.library.push(key);state.log.custom=false;save();render()}
function nextMilestone(checkUnlock=false){const t=allTimeTogether(),s=allTimeSessions(),mix=mixRaw('week'),areas=Object.values(mix).filter(v=>v>=5).length;const ms=[{title:'First 60 minutes together',value:t,target:60,subtitle:'A milestone for the time you make together.'},{title:'5 shared play sessions',value:s,target:5,subtitle:'Celebrating the moments you showed up.'},{title:'First varied week',value:areas,target:5,subtitle:'Explore 5 different cognitive areas together.'},{title:'5 hours together',value:t,target:300,subtitle:'Five hours of intentional play together.'},{title:'20 shared sessions',value:s,target:20,subtitle:'Twenty shared play moments.'}];let m=ms.find(x=>x.value<x.target)||ms[ms.length-1];if(checkUnlock){let unlocked=ms.filter(x=>x.value>=x.target);let latest=unlocked[unlocked.length-1];if(latest&&((latest.target===60&&t-state.log.together<60)||(latest.target===5&&s-1<5)||(latest.target===300&&t-state.log.together<300)||(latest.target===20&&s-1<20))){return {...latest,justUnlocked:true}}}return m}
function planFocusSkills(){const raw=mixRaw('week'),keys=Object.keys(SKILLS),hasPlay=Object.values(raw).some(v=>v>0);return hasPlay?keys.sort((a,b)=>raw[a]-raw[b]).slice(0,3):['language','attention','creativity']}
function weeklyProgressScore(){const goal=Math.max(1,state.profile.goal||120),timeScore=Math.min(1,togetherMinutes()/goal),raw=mixRaw('week'),active=Object.values(raw).filter(v=>v>0).length,varietyScore=Math.min(1,active/6);return Math.round((timeScore*.6+varietyScore*.4)*100)}
function planSummary(){const mins=togetherMinutes(),goal=state.profile.goal||120,sessions=weekSessions(),raw=mixRaw('week'),variety=Object.values(raw).filter(v=>v>0).length,p=mins/goal;if(mins===0)return "A fresh week ahead. One small playful moment is all it takes to get things moving.";if(p>=1&&variety>=5)return "Beautiful week so far — you’ve made time for each other and kept play nicely varied.";if(p>=.8)return "You’re very close to your weekly goal. One more easy play moment could round things out nicely.";if(sessions>=2&&variety>=4)return "You’ve built a lovely rhythm already. A little more variety can make the week feel even richer.";if(p>=.35)return "You’re well on your way. Keep following the moments that feel easy and fun.";return "Lovely start. A few more playful moments and your week will begin to take shape."}
function planLibraryRanked(focus){let items=state.library.map(id=>({id,...(PRESETS[id]||{})})).filter(x=>x.name&&x.skills);if(!items.length)items=Object.entries(PRESETS).slice(0,3).map(([id,p])=>({id,...p}));items.sort((a,b)=>focus.reduce((n,k)=>n+(b.skills[k]||0),0)-focus.reduce((n,k)=>n+(a.skills[k]||0),0));return items}
function planLibraryPick(focus){return planLibraryRanked(focus)[0]||null}
function togglePlanChooser(){planChooserOpen=!planChooserOpen;render()}
function planChooser(focus,own){if(!planChooserOpen)return '';const items=planLibraryRanked(focus).filter(x=>!own||x.id!==own.id);return `<div style="margin-top:12px"><span class="eyebrow">Choose another</span><div style="display:grid;gap:8px;margin-top:8px">${items.map((g,i)=>`<button class="btn ghost full" style="text-align:left;height:auto;padding:12px 14px" onclick="useLibraryFromPlan('${g.id}')"><b>${g.emoji} ${g.name}</b><span class="muted" style="display:block;font-size:11px;margin-top:3px">${skillChips(g.skills,3)}</span></button>`).join('')}</div></div>`}
function planNewPick(focus){let libNames=new Set(state.library.map(id=>(PRESETS[id]||{}).name).filter(Boolean));let candidates=GAMES.filter(g=>state.profile.age>=g.ageMin&&state.profile.age<=g.ageMax&&!libNames.has(g.name));candidates.sort((a,b)=>focus.reduce((n,k)=>n+(b.skills[k]||0),0)-focus.reduce((n,k)=>n+(a.skills[k]||0),0));return candidates[0]||GAMES[0]}
function useLibraryFromPlan(id){chooseKnown('preset',id,(PRESETS[id]||{}).name||'');state.screen='log';save();render();window.scrollTo(0,0)}
function weekly(){const focus=planFocusSkills(),own=planLibraryPick(focus),fresh=planNewPick(focus),score=weeklyProgressScore();return `${header()}<main class="page"><button class="link" onclick="go('home')">← Home</button><div class="screen-head"><span class="eyebrow">Your plan</span><h1>Your week</h1><p class="muted">A quick look at where you are — and what could fit nicely next.</p></div><section class="card panel"><div style="display:flex;align-items:end;justify-content:space-between;gap:12px"><div><span class="eyebrow">Weekly progress</span><div style="font-size:34px;font-weight:830;letter-spacing:-.05em;margin-top:5px">${score}% <span style="font-size:14px;color:var(--muted);font-weight:700;letter-spacing:-.01em">on track</span></div></div></div><div class="progress" style="margin-top:12px"><span style="width:${score}%"></span></div><div class="insight" style="margin-top:10px">${planSummary()}</div><p class="muted" style="font-size:10px;margin:9px 2px 0">Weekly progress combines time toward your goal with the variety of play you’ve shared.</p></section><section class="section card panel"><span class="eyebrow">What to focus on next</span><div class="chips" style="margin-top:10px">${focus.map(k=>`<span class="chip">${SKILLS[k].emoji} ${SKILLS[k].label}</span>`).join('')}</div><p class="muted" style="font-size:12px;margin:11px 0 0">These would add the most variety to your week right now.</p></section>${own?`<section class="section card game-card"><div class="game-top"><div class="game-emoji">${own.emoji}</div><div class="rank">From your games</div></div><h2>${own.name}</h2><p class="muted">This looks like a strong fit from the games you already use.</p><div class="chips">${skillChips(own.skills,3)}</div><div class="two" style="margin-top:14px"><button class="btn primary" onclick="useLibraryFromPlan('${own.id}')">Play this</button><button class="btn ghost" onclick="togglePlanChooser()">${planChooserOpen?'Hide choices':'Choose another'}</button></div>${planChooser(focus,own)}</section>`:''}<section class="section card game-card"><div class="game-top"><div class="game-emoji">${fresh.emoji}</div><div class="rank">Try something new</div></div><h2>${fresh.name}</h2><p class="muted">${fresh.duration} min · ${fresh.locations[0][0].toUpperCase()+fresh.locations[0].slice(1)} · ${fresh.materials.join(', ')}</p><div class="chips">${skillChips(fresh.skills,3)}</div><button class="btn primary full" style="margin-top:14px" onclick="openGame('${fresh.id}')">See game</button></section><button class="btn secondary full" style="margin-top:14px" onclick="findForSkills([${focus.map(k=>`'${k}'`).join(',')}])">Find another game</button></main>${nav('home')}`}
function findForSkills(keys){state.play.mode='skills';state.play.skills=keys.slice(0,3);state.screen='play';save();render();window.scrollTo(0,0)}
function findForSkill(k){state.play.mode='skills';state.play.skills=[k];state.screen='play';save();render()}

function toggleDiscoverLike(k){const a=state.discover.likes||[];state.discover.likes=a.includes(k)?a.filter(x=>x!==k):(a.length<3?[...a,k]:a);save();render()}
function toggleDiscoverSkill(k){const a=state.discover.skills||[];state.discover.skills=a.includes(k)?a.filter(x=>x!==k):(a.length<3?[...a,k]:a);save();render()}
function productScore(p){const age=state.profile.age||5;if(age<p.ageMin||age>p.ageMax)return -999;let sc=10;for(const l of state.discover.likes||[])if(p.likes.includes(l))sc+=24;for(const k of state.discover.skills||[])sc+=(p.skills[k]||0)*1.2;return sc}
function discoverProducts(){return PRODUCTS.map(p=>({...p,_score:productScore(p)})).filter(p=>p._score>-100).sort((a,b)=>b._score-a._score).slice(0,3)}
function amazonUrl(name){return 'https://www.amazon.de/s?k='+encodeURIComponent(name)}
function productWhy(p){const selected=(state.discover.skills||[]).filter(k=>p.skills[k]);const liked=(state.discover.likes||[]).filter(k=>p.likes.includes(k));if(liked.length&&selected.length)return `Matches ${DISCOVER_LIKES[liked[0]][1].toLowerCase()} and gives plenty of ${SKILLS[selected[0]].label.toLowerCase()} play.`;if(selected.length)return `A strong match for ${selected.slice(0,2).map(k=>SKILLS[k].label.toLowerCase()).join(' + ')}.`;if(liked.length)return `Fits their interest in ${DISCOVER_LIKES[liked[0]][1].toLowerCase()}.`;return `A well-rounded option for age ${state.profile.age}.`}
function discover(){const likes=state.discover.likes||[],skills=state.discover.skills||[],products=discoverProducts();return `${header()}<main class="page"><div class="screen-head"><span class="eyebrow">Gifts</span><h1>Gift ideas for your child</h1><p class="muted">Thoughtful game picks based on what they enjoy and what you’d like to practise more.</p></div><section class="card panel"><div class="filter-label">What does your child enjoy?</div><div class="pref-grid">${Object.entries(DISCOVER_LIKES).map(([k,[em,l]])=>`<button class="pref ${likes.includes(k)?'sel':''}" onclick="toggleDiscoverLike('${k}')"><span class="em">${em}</span>${l}</button>`).join('')}</div><div class="discover-count">Choose up to 3 · ${likes.length}/3 selected</div><div class="filter-label">Cognitive skills</div><p class="muted" style="font-size:11px;margin:-3px 0 9px">What would you like to practise a little more?</p><div class="skill-grid">${Object.entries(SKILLS).map(([k,v])=>`<button class="skill ${skills.includes(k)?'sel':''}" onclick="toggleDiscoverSkill('${k}')"><span class="em">${v.emoji}</span><span>${v.label}</span></button>`).join('')}</div><div class="counter">Choose up to 3 · ${skills.length}/3 selected</div></section><div class="section-head" style="margin-top:18px"><div><span class="eyebrow">Picked for age ${state.profile.age}</span><h2>Thoughtful picks</h2></div></div><div class="product-list">${products.map((p,i)=>`<section class="card product-card"><div class="product-head"><div class="product-art">${p.emoji}</div><div><div class="rank">${i===0?'Best fit':'Good fit'}</div><h3>${p.name}</h3><div class="product-meta">Age ${p.ageMin}+ · Real product</div></div></div><div class="chips" style="margin-top:12px">${skillChips(p.skills,3)}</div><div class="product-why"><b>Why this could be a lovely fit</b><br>${productWhy(p)}</div><button class="btn primary full" onclick="window.open(amazonUrl('${p.name.replaceAll("'","\\'")}'),'_blank','noopener')">View on Amazon</button></section>`).join('')}</div><p class="affiliate-note">Product links currently open Amazon search results. Affiliate tracking can be added later without changing this recommendation flow.</p></main>${nav('discover')}`}
function library(){let items=state.library.map(id=>({id,...(PRESETS[id]||{})})).filter(x=>x.name);return `${header()}<main class="page"><div class="screen-head"><span class="eyebrow">Library</span><h1>What your family already plays</h1><p class="muted">Your familiar games and saved SmartParent ideas.</p></div><div class="library-grid">${items.map(a=>`<section class="card lib-card"><div class="game-emoji">${a.emoji}</div><div><h3>${a.name}</h3><p class="muted">${topSkillNames(a.skills)}</p></div><button class="link" onclick="chooseKnown('preset','${a.id}','${esc(a.name)}');state.screen='log';render()">Log →</button></section>`).join('')}</div><button class="btn secondary full" style="margin-top:14px" onclick="startLog()">＋ Add something you play</button></main>${nav('discover')}`}
function milestones(){const t=allTimeTogether(),s=allTimeSessions(),areas=Object.values(mixRaw('week')).filter(v=>v>=5).length;const list=[['❤️','First 60 minutes together',t,60,'Time together'],['🎲','5 shared play sessions',s,5,'Consistency'],['🌈','First varied week',areas,5,'Variety'],['⏱️','5 hours together',t,300,'Time together'],['✨','20 shared sessions',s,20,'Consistency']];const presets=[60,90,120,180];return `${header()}<main class="page"><button class="link" onclick="go('home')">← Home</button><div class="screen-head"><span class="eyebrow">Goals & milestones</span><h1>Your time together, celebrated.</h1><p class="muted">Choose a weekly goal that feels right for your family. Milestones unlock naturally as you make time to play together.</p></div><section class="card goal-card"><span class="eyebrow">Your weekly goal</span><div class="goal-current"><strong>${state.profile.goal}</strong><span>minutes together</span></div><div class="goal-options">${presets.map(n=>`<button class="${state.profile.goal===n?'sel':''}" onclick="setWeeklyGoal(${n})">${n} min</button>`).join('')}</div><div class="goal-custom"><input id="customGoal" class="input" type="number" min="15" step="5" placeholder="Custom minutes"><button class="btn secondary" onclick="applyCustomGoal()">Set</button></div><p class="muted" style="margin-top:10px">A personal target for your family — not a developmental requirement.</p></section><div class="section-head"><div><span class="eyebrow">Your progress</span><h2>Milestones</h2></div></div><div class="milestones">${list.map(([em,title,v,target,cat])=>`<section class="card ms ${v>=target?'':'locked'}"><div class="badge">${em}</div><div><span class="eyebrow">${cat}</span><h3>${title}</h3><p class="muted">${Math.min(v,target)} / ${target}${target>=60?' min':''}${v>=target?' · Unlocked':''}</p></div></section>`).join('')}</div></main>${nav('milestones')}`}
function setWeeklyGoal(n){state.profile.goal=Math.max(15,Number(n)||120);save();render()}
function applyCustomGoal(){const el=document.getElementById('customGoal');if(!el)return;const n=Number(el.value);if(Number.isFinite(n)&&n>=15)setWeeklyGoal(n)}
function profile(){return `${header()}<main class="page"><button class="link" onclick="go('home')">← Home</button><div class="screen-head"><span class="eyebrow">Profile</span><h1>Your family setup</h1><p class="muted">Keep it simple. These settings help SmartParent make better suggestions.</p></div><section class="card panel"><div class="profile-row"><label>Child name (optional)</label><input class="input" value="${state.profile.name}" onchange="setProfile('name',this.value)" placeholder="Name" /></div><div class="profile-row"><label>Age</label><select class="input" onchange="setProfile('age',Number(this.value))">${[4,5,6,7,8].map(n=>`<option ${state.profile.age===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="profile-row"><label>How Cognitive Mix works</label><p class="muted" style="font-size:11px;margin:0">Cognitive Mix describes the kinds of cognitive skills involved in the games you play together. It is not a measure of your child's ability or development.</p></div></section></main>${nav('home')}`}
function setProfile(k,v){state.profile[k]=v;save();render()}
function render(){const root=document.getElementById('app');switch(state.screen){case'play':root.innerHTML=play();break;case'log':root.innerHTML=log();break;case'discover':root.innerHTML=discover();break;case'library':root.innerHTML=library();break;case'game':root.innerHTML=gameDetail();break;case'weekly':root.innerHTML=weekly();break;case'milestones':root.innerHTML=milestones();break;case'profile':root.innerHTML=profile();break;default:root.innerHTML=home()}}
render();
</script>
</body>
</html>
